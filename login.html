<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SMART FORM ENTERPRISE</title>

<link rel="stylesheet"
href="assets/css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            <h1>SMART FORM</h1>

            <span>ENTERPRISE v6.0</span>

        </div>

        <form id="loginForm">

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    autocomplete="username"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required>

            </div>

            <div class="remember">

                <input
                    type="checkbox"
                    id="remember">

                <label for="remember">
                    Remember Me
                </label>

            </div>

            <button
                type="submit"
                id="loginBtn">

                LOGIN

            </button>

        </form>

        <div
            id="message"
            class="message">

        </div>

    </div>

</div>

<script src="assets/js/login.js"></script>

</body>

</html>
