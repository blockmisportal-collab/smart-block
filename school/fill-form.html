<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
SMART FORM ENTERPRISE v6.1 - Fill Form
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:"Segoe UI",Arial,sans-serif;

background:#f4f7fb;

}


.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}


.header h1{
margin:0;
}


button{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}


.back{

background:#d32f2f;

color:white;

}



.container{

padding:25px;

}



.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:
0 5px 20px rgba(0,0,0,.12);

margin-bottom:20px;

}



.info{

display:flex;

gap:20px;

flex-wrap:wrap;

}



.info-box{

background:#f5f9ff;

padding:15px;

border-radius:10px;

flex:1;

}



.title{

color:#0d47a1;

font-weight:bold;

}



input{

width:100%;

padding:12px;

margin-top:8px;

border:1px solid #ccc;

border-radius:6px;

}



label{

font-weight:bold;

color:#0d47a1;

}



.field{

margin-bottom:15px;

}



.submit{

background:green;

color:white;

}



.lock{

background:#d32f2f;

color:white;

padding:15px;

border-radius:10px;

font-weight:bold;

}


.success{

background:#2e7d32;

color:white;

padding:15px;

border-radius:10px;

}


</style>

</head>


<body>


<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>

<p>
DYNAMIC FORM ENTRY
</p>

</div>



<button class="back"
onclick="goBack()">

BACK

</button>


</div>




<div class="container">


<div class="card">


<h2>
School Information
</h2>



<div class="info">


<div class="info-box">

<span class="title">
School Name
</span>

<br>

<span id="schoolName">
-
</span>


</div>



<div class="info-box">

<span class="title">
UDISE Code
</span>

<br>

<span id="schoolCode">
-
</span>


</div>



<div class="info-box">

<span class="title">
Form Name
</span>

<br>

<span id="formName">
Loading...
</span>


</div>


</div>


</div>





<div class="card">


<div id="message"></div>


<h2 id="title">
Loading Form...
</h2>



<form id="dynamicForm">


<div id="fields">

</div>



<button
type="submit"
id="submitBtn"
class="submit">

💾 Submit Form

</button>


</form>


</div>


</div>





<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";



let formId =
new URLSearchParams(
location.search
).get("id");



let USER =
JSON.parse(
localStorage.getItem("USER")
||
"{}"
);



let locked=false;





function loadUser(){


document.getElementById(
"schoolName"
).innerHTML =
USER.schoolName || "-";


document.getElementById(
"schoolCode"
).innerHTML =
USER.schoolCode || "-";


}








async function loadForm(){


let response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},


body:JSON.stringify({

action:"getForm",

formId:formId

})


});


let result =
await response.json();



if(!result.success){

document.getElementById("title").innerHTML=
"No Form Found";

return;

}



let form=result.data;


document.getElementById(
"formName"
).innerHTML =
form.name;


document.getElementById(
"title"
).innerHTML =
form.name;



let html="";


form.fields.forEach(
field=>{


html +=

`

<div class="field">

<label>
${field.name}
</label>

<input

name="${field.name}"

type="${
field.type==="Number"
?
"number"
:
"text"
}"

required>


</div>

`;


});



document.getElementById(
"fields"
).innerHTML=html;


checkLock();



}








async function checkLock(){


let response =
await fetch(
API_URL,
{


method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},


body:JSON.stringify({

action:"checkResponse",

formId:formId,

schoolCode:
USER.schoolCode


})


});


let result =
await response.json();



if(result.locked){


locked=true;


document.getElementById(
"message"
).innerHTML=

`

<div class="lock">

🔒 यह Form पहले ही Submit हो चुका है।

<br>

Form Locked

</div>

`;



document.getElementById(
"submitBtn"
).disabled=true;


}


}








document
.getElementById(
"dynamicForm"
)
.addEventListener(
"submit",
async function(e){


e.preventDefault();



if(locked){

return;

}



let btn =
document.getElementById(
"submitBtn"
);



btn.disabled=true;

btn.innerHTML=
"Submitting...";





let data={};



new FormData(this)
.forEach(
(v,k)=>{


data[k]=v;


});





let response =
await fetch(
API_URL,
{


method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},


body:JSON.stringify({

action:"saveResponse",


formId:formId,


formName:

document.getElementById(
"formName"
).innerText,



user:USER,


response:data


})


});





let result =
await response.json();





if(result.success){


locked=true;


document.getElementById(
"message"
).innerHTML=

`

<div class="success">

✅ Response Submitted Successfully

<br>

🔒 Form Locked

</div>

`;



btn.style.display="none";



}
else{


alert(
result.message
);


btn.disabled=false;

btn.innerHTML=
"💾 Submit Form";


}



});







function goBack(){

location.href=
"forms.html";

}



loadUser();

loadForm();


</script>


</body>

</html>
