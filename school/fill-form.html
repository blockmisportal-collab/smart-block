<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Fill Form
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}



.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

}



.back{

background:#d32f2f;

color:white;

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.container{

padding:25px;

}



.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

margin-bottom:20px;

}



.info{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

}



.info-box{

background:#f5f9ff;

padding:15px;

border-radius:10px;

}



.label{

font-weight:bold;

color:#0d47a1;

}



input,
select,
textarea{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:6px;

margin-top:8px;

}



.form-group{

margin-bottom:15px;

}



.submit{

background:#2e7d32;

color:white;

border:none;

padding:12px 25px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.loading{

text-align:center;

padding:20px;

}



@media(max-width:800px){

.info{

grid-template-columns:1fr;

}

}


</style>
<body>


<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>

<p>
DYNAMIC FORM ENTRY
</p>

</div>



<button
class="back"
onclick="goBack()">

BACK

</button>


</div>







<div class="container">





<!-- SCHOOL INFO -->


<div class="card">


<h2>
School Information
</h2>



<div class="info">


<div class="info-box">


<div class="label">
School Name
</div>


<div id="schoolName">
-
</div>


</div>





<div class="info-box">


<div class="label">
UDISE Code
</div>


<div id="udiseCode">
-
</div>


</div>




<div class="info-box">


<div class="label">
Form Name
</div>


<div id="formTitle">
Loading...
</div>


</div>



</div>


</div>









<!-- FORM AREA -->


<div class="card">


<h2 id="title">

Loading Form...

</h2>



<form id="dynamicForm">


<div id="formFields">


<div class="loading">

Loading Fields...

</div>


</div>





<button
type="submit"
class="submit">

💾 Submit Form

</button>



</form>



</div>







</div>









<script>


/*====================================
 API
=====================================*/


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";







let formId =

new URLSearchParams(

window.location.search

)

.get("id");







let currentForm={};









/*====================================
 LOAD USER
=====================================*/


let user =

JSON.parse(

localStorage.getItem("USER")

||

"{}"

);




document.getElementById(
"schoolName"
).innerText =

user.schoolName || "-";




document.getElementById(
"udiseCode"
).innerText =

user.schoolCode || "-";









/*====================================
 LOAD FORM DETAIL
=====================================*/


async function loadForm(){



try{


let response =

await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"getForm",


formId:formId


})


}

);






let result =

JSON.parse(

await response.text()

);







if(

result.success !== true

){


document.getElementById(
"formFields"
).innerHTML=

"No Form Found";


return;


}





currentForm =

result.data;







document.getElementById(
"formTitle"
).innerText =

currentForm.name;



document.getElementById(
"title"
).innerText =

currentForm.name;







createFields(

currentForm.fields

);





}

catch(error){


console.error(error);


document.getElementById(
"formFields"
).innerHTML=

"Server Error";


}



}









/*====================================
 CREATE DYNAMIC FIELDS
=====================================*/


function createFields(fields){



let html="";





fields.forEach(

field=>{



let type="text";



if(
field.type==="Number"
){

type="number";

}


else if(
field.type==="Date"
){

type="date";

}






html +=



`

<div class="form-group">


<label>

${field.name}

</label>



<input

type="${type}"

name="${field.name}"

placeholder="Enter ${field.name}"

required>


</div>


`;





});







document.getElementById(

"formFields"

)

.innerHTML=

html;



}









/*====================================
 SUBMIT
=====================================*/


document

.getElementById(
"dynamicForm"
)

.addEventListener(

"submit",

function(e){


e.preventDefault();




let data={};



new FormData(this)

.forEach(

(value,key)=>{


data[key]=value;


}

);





console.log(

"FORM RESPONSE",

data

);




document
.getElementById(
"dynamicForm"
)
.addEventListener(

"submit",

async function(e){


e.preventDefault();



let data={};



new FormData(this)

.forEach(

(value,key)=>{


data[key]=value;


}

);




let user =

JSON.parse(

localStorage.getItem("USER")

||

"{}"

);





let response =

await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:

JSON.stringify({


action:"saveResponse",


formId:formId,


formName:currentForm.name,


user:user,


response:data



})


}

);







let result =

JSON.parse(

await response.text()

);






if(result.success){


alert(

"Form Submitted Successfully"

);


document
.getElementById(
"dynamicForm"
)
.reset();


}

else{


alert(

result.message

);


}



}

);





}


);









/*====================================
 BACK
=====================================*/


function goBack(){


window.location.href=

"forms.html";


}






loadForm();



</script>


</body>


</html>

</head>
