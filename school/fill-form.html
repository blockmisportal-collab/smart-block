<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Dynamic Form
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}



/* HEADER */

.header{

background:linear-gradient(
135deg,
#0d47a1,
#1565c0
);

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

font-size:26px;

}



.header p{

margin:5px 0 0;

}




button{

border:none;

padding:12px 18px;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}




.back{

background:#d32f2f;

color:white;

}




.container{

padding:25px;

}




.card{

background:white;

padding:25px;

border-radius:15px;

margin-bottom:20px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

}




.info{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(220px,1fr)
);

gap:20px;

}




.info-box{

background:#f5f9ff;

padding:18px;

border-radius:10px;

border-left:

5px solid #1565c0;

}




.title{

font-weight:bold;

color:#0d47a1;

}




.field{

margin-bottom:18px;

}



label{

display:block;

font-weight:bold;

color:#0d47a1;

}




input,
select,
textarea{


width:100%;

padding:12px;

margin-top:8px;

border:1px solid #ccc;

border-radius:8px;

font-size:15px;

}




.submit{

background:#2e7d32;

color:white;

width:100%;

font-size:16px;

}




.lock{

background:#c62828;

color:white;

padding:15px;

border-radius:10px;

}



.success{

background:#2e7d32;

color:white;

padding:15px;

border-radius:10px;

}



.loading{

text-align:center;

padding:20px;

font-weight:bold;

}



</style>


</head>



<body>


<div class="header">


<div>

<h1>
🏫 SMART FORM ENTERPRISE v6.1
</h1>


<p>
ONLINE SCHOOL FORM SYSTEM
</p>


</div>



<button
class="back"
onclick="goBack()">

BACK

</button>


</div>






<div class="container">



<div class="card">


<h2>
🏫 School Information
</h2>




<div class="info">



<div class="info-box">

<div class="title">
School Name
</div>

<div id="schoolName">
-
</div>

</div>





<div class="info-box">

<div class="title">
UDISE Code
</div>

<div id="schoolCode">
-
</div>

</div>





<div class="info-box">

<div class="title">
Form Name
</div>

<div id="formName">
-
</div>

</div>



</div>


</div>








<div class="card">


<div id="message"></div>



<h2 id="formTitle">

Loading Form...

</h2>




<form id="dynamicForm">


<div id="fields">

<div class="loading">

Loading Fields...

</div>


</div>




<button

type="submit"

id="submitBtn"

class="submit">

💾 Submit Form

</button>



</form>


</div>



</div>





<script>


/*========================
 API CONFIGURATION
========================*/


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";





let formId =

new URLSearchParams(
window.location.search
)

.get("id");





let USER =

JSON.parse(

localStorage.getItem("USER")

||

"{}"

);





let locked=false;






/*========================
 LOAD USER
========================*/


function loadUser(){



document.getElementById(
"schoolName"
)

.innerHTML =

USER.schoolName || "-";





document.getElementById(
"schoolCode"
)

.innerHTML =

USER.schoolCode || "-";



}
/*========================
 LOAD FORM
========================*/


async function loadForm(){


try{


let response = await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:"getForm",

formId:formId

})

}

);





let result = await response.json();





if(!result.success){


document.getElementById(
"formTitle"
).innerHTML=

"Form Not Found";


return;


}






let form=result.data;






document.getElementById(
"formName"
).innerHTML=

form.name;





document.getElementById(
"formTitle"
).innerHTML=

form.name;







let html="";






form.fields.forEach(field=>{



let type="text";




if(field.type==="Number"){


type="number";


}



if(field.type==="Date"){


type="date";


}





html+=`

<div class="field">

<label>

${field.name}

</label>


<input

type="${type}"

name="${field.name}"

required>


</div>


`;



});







document.getElementById(
"fields"
)

.innerHTML=html;






checkLock();





}

catch(error){



console.log(
"Form Load Error",
error
);



document.getElementById(
"fields"
)

.innerHTML=

`

<div class="lock">

Server Error

</div>

`;



}



}









/*========================
 CHECK FORM LOCK
========================*/


async function checkLock(){


try{


let response = await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:"checkLock",

formId:formId,

schoolCode:

USER.schoolCode


})

}

);






let result = await response.json();







if(

result.success

&&

result.locked===true

){



locked=true;






document.getElementById(
"message"
)

.innerHTML=

`

<div class="lock">

🔒 यह Form पहले Submit हो चुका है।


<br><br>

कृपया Nodal/Admin से संपर्क करें।

</div>

`;







disableForm();



}



}

catch(error){


console.log(
"Lock Check Error",
error
);



}



}









/*========================
 DISABLE FORM
========================*/


function disableForm(){



document

.querySelectorAll(

"#dynamicForm input"

)

.forEach(function(el){



el.disabled=true;



});







let btn=

document.getElementById(
"submitBtn"
);






btn.disabled=true;


btn.innerHTML=

"🔒 Form Locked";



btn.style.background="#c62828";



}
/*========================
 SUBMIT FORM
========================*/


document

.getElementById(
"dynamicForm"
)

.addEventListener(

"submit",

async function(e){


e.preventDefault();





if(locked){


return;


}





let btn =

document.getElementById(
"submitBtn"
);





btn.disabled=true;


btn.innerHTML=

"Submitting...";







let responseData={};






new FormData(this)

.forEach(

(value,key)=>{


responseData[key]=value;


}

);







try{



/*========================
 SAVE RESPONSE
========================*/


let saveResponse = await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:"saveResponse",


formId:formId,


formName:

document.getElementById(
"formName"
).innerHTML,



schoolCode:

USER.schoolCode,



schoolName:

USER.schoolName,



user:USER,



response:

responseData



})

}

);








let result =

await saveResponse.json();







if(result.success){



/*========================
 RESET APPROVAL
 AFTER RE-SUBMIT
========================*/



await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:

"resetApprovalAfterResubmit",


formId:

formId,


schoolCode:

USER.schoolCode



})

}

);









/*========================
 CREATE LOCK
========================*/


await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:

"createLock",


formId:

formId,


schoolCode:

USER.schoolCode



})

}

);








locked=true;






document.getElementById(
"message"
)

.innerHTML=

`

<div class="success">

✅ Response Submitted Successfully

<br><br>

🔒 Form Locked Successfully

</div>

`;







disableForm();






}

else{


alert(

result.message ||

"Submit Failed"

);



btn.disabled=false;


btn.innerHTML=

"💾 Submit Form";



}





}

catch(error){



console.log(
error
);



alert(
"Server Error"
);



btn.disabled=false;


btn.innerHTML=

"💾 Submit Form";



}





}

);









/*========================
 BACK
========================*/


function goBack(){


window.location.href=

"forms.html";


}









/*========================
 PAGE LOAD
========================*/


loadUser();

loadForm();
