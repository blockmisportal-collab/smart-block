<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Fill Form
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}



.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

}



button{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.back{

background:#d32f2f;

color:white;

}




.container{

padding:25px;

}




.card{

background:white;

padding:25px;

border-radius:15px;

margin-bottom:20px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

}




.info{

display:flex;

gap:20px;

flex-wrap:wrap;

}



.info-box{

background:#f5f9ff;

padding:15px;

border-radius:10px;

flex:1;

}



.title{

font-weight:bold;

color:#0d47a1;

}




.field{

margin-bottom:15px;

}



label{

font-weight:bold;

color:#0d47a1;

display:block;

}




input,
select,
textarea{


width:100%;

padding:12px;

margin-top:8px;

border:1px solid #ccc;

border-radius:6px;

}





input:disabled,
select:disabled,
textarea:disabled{


background:#eeeeee;

cursor:not-allowed;


}





.submit{

background:green;

color:white;

}





.lock{

background:#d32f2f;

color:white;

padding:15px;

border-radius:10px;

font-weight:bold;

margin-bottom:15px;

}





.success{

background:#2e7d32;

color:white;

padding:15px;

border-radius:10px;

font-weight:bold;

margin-bottom:15px;

}



.loading{

text-align:center;

padding:20px;

}



</style>


</head>



<body>



<div class="header">


<div>


<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
DYNAMIC SCHOOL FORM
</p>


</div>



<button
class="back"
onclick="goBack()">

BACK

</button>


</div>







<div class="container">





<div class="card">


<h2>
School Information
</h2>



<div class="info">


<div class="info-box">

<span class="title">
School Name
</span>

<br>

<span id="schoolName">
-
</span>


</div>





<div class="info-box">

<span class="title">
UDISE Code
</span>

<br>

<span id="schoolCode">
-
</span>


</div>





<div class="info-box">

<span class="title">
Form Name
</span>

<br>

<span id="formName">
-
</span>


</div>




</div>


</div>








<div class="card">



<div id="message"></div>




<h2 id="formTitle">

Loading Form...

</h2>





<form id="dynamicForm">


<div id="fields">

<div class="loading">

Loading...

</div>

</div>





<button

type="submit"

id="submitBtn"

class="submit">

💾 Submit Form

</button>




</form>




</div>







  <script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";



let formId =

new URLSearchParams(
window.location.search
).get("id");



let USER =

JSON.parse(

localStorage.getItem("USER")

||

"{}"

);



let locked=false;







/*========================
 LOAD USER
========================*/


function loadUser(){


document.getElementById(
"schoolName"
).innerHTML =

USER.schoolName || "-";



document.getElementById(
"schoolCode"
).innerHTML =

USER.schoolCode || "-";


}








/*========================
 LOAD FORM
========================*/


async function loadForm(){


try{


let res = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"getForm",


formId:formId


})


}

);




let result =

await res.json();





if(!result.success){


document.getElementById(
"formTitle"
).innerHTML=

"Form Not Found";


return;


}





let form=result.data;



document.getElementById(
"formName"
).innerHTML=

form.name;



document.getElementById(
"formTitle"
).innerHTML=

form.name;





let html="";





form.fields.forEach(field=>{


let type="text";


if(field.type==="Number"){

type="number";

}


if(field.type==="Date"){

type="date";

}




html+=`

<div class="field">


<label>

${field.name}

</label>


<input

type="${type}"

name="${field.name}"

required>


</div>


`;


});






document.getElementById(
"fields"
).innerHTML=

html;





checkLock();



}

catch(error){


console.log(error);


}



}









/*========================
 CHECK LOCK
========================*/


async function checkLock(){



let res = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"checkResponse",


formId:formId,


schoolCode:

USER.schoolCode


})


}

);





let result=

await res.json();






if(result.locked===true){



locked=true;





document.getElementById(
"message"
).innerHTML=



`

<div class="lock">

🔒 यह Form पहले ही Submit हो चुका है।

<br>

सभी Field Locked हैं।

</div>

`;







/*========================
 DISABLE ALL FIELDS
========================*/


document

.querySelectorAll(

"#dynamicForm input, #dynamicForm select, #dynamicForm textarea"

)

.forEach(function(field){


field.disabled=true;


});






let btn=

document.getElementById(
"submitBtn"
);



btn.disabled=true;


btn.innerHTML=

"🔒 Form Locked";



btn.style.background="#d32f2f";





}




}









/*========================
 SAVE FORM
========================*/


document

.getElementById(
"dynamicForm"
)

.addEventListener(

"submit",

async function(e){



e.preventDefault();





if(locked){


return;


}






let btn=

document.getElementById(
"submitBtn"
);



btn.disabled=true;


btn.innerHTML=

"Submitting...";







let data={};





new FormData(this)

.forEach(

(value,key)=>{


data[key]=value;


}

);







try{



let res=

await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"saveResponse",



formId:formId,



formName:

document.getElementById(
"formName"
).innerHTML,



user:USER,



response:data



})


}

);







let result=

await res.json();






if(result.success){



locked=true;



document.getElementById(
"message"
).innerHTML=

`

<div class="success">

✅ Response Submitted Successfully

<br>

🔒 Form Locked

</div>

`;





document

.querySelectorAll(

"#dynamicForm input, #dynamicForm select, #dynamicForm textarea"

)

.forEach(function(field){


field.disabled=true;


});





btn.innerHTML=

"🔒 Form Locked";


btn.disabled=true;



}



else{



alert(

result.message

);



btn.disabled=false;


btn.innerHTML=

"💾 Submit Form";


}





}

catch(error){


alert(

"Server Error"

);


btn.disabled=false;


btn.innerHTML=

"💾 Submit Form";


}



});










function goBack(){


window.location.href=

"forms.html";


}






loadUser();

loadForm();



</script>


</body>

</html>
</div>
