<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>

SMART FORM ENTERPRISE v6.1 - School Forms

</title>




<style>


*{

box-sizing:border-box;

}



body{


margin:0;


font-family:

"Segoe UI",
Arial,
sans-serif;


background:#f4f7fb;


}





/* HEADER */

.header{


background:#0d47a1;


color:white;


padding:20px 30px;


display:flex;


justify-content:space-between;


align-items:center;


}



.header h1{


margin:0;


font-size:26px;


}



.header p{


margin:5px 0 0;


}







button{


border:none;


padding:10px 18px;


border-radius:6px;


cursor:pointer;


font-weight:bold;


}





.back{


background:#d32f2f;


color:white;


}



.open{


background:#1565c0;


color:white;


}





.container{


padding:25px;


}







.card{


background:white;


padding:25px;


border-radius:15px;


box-shadow:


0 5px 20px rgba(0,0,0,.12);


margin-bottom:20px;


}







/* SCHOOL INFO */


.info{


display:grid;


grid-template-columns:


repeat(3,1fr);


gap:20px;


}




.info-box{


background:#f5f9ff;


padding:20px;


border-radius:10px;


}




.label{


color:#0d47a1;


font-weight:bold;


}




.value{


font-size:18px;


margin-top:8px;


}







/* TABLE */


table{


width:100%;


border-collapse:collapse;


}



th{


background:#0d47a1;


color:white;


padding:12px;


}



td{


padding:12px;


border-bottom:1px solid #ddd;


text-align:center;


}





tr:hover{


background:#f1f6ff;


}






.loading{


text-align:center;


padding:20px;


}





.badge{


background:#2e7d32;


color:white;


padding:5px 12px;


border-radius:20px;


font-size:12px;


}






@media(max-width:800px){



.info{


grid-template-columns:1fr;


}



table{


font-size:13px;


}


}



</style>

<body>


<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>

<p>
SCHOOL FORM MANAGEMENT
</p>

</div>



<button
class="back"
onclick="goBack()">

BACK

</button>


</div>







<div class="container">





<!-- SCHOOL INFORMATION -->


<div class="card">


<h2>
School Information
</h2>



<div class="info">



<div class="info-box">

<div class="label">
School Name
</div>


<div class="value"
id="schoolName">

-

</div>


</div>





<div class="info-box">


<div class="label">
UDISE Code
</div>


<div class="value"
id="udiseCode">

-

</div>


</div>





<div class="info-box">


<div class="label">
User Role
</div>


<div class="value"
id="userRole">

SCHOOL

</div>


</div>




</div>


</div>










<!-- ACTIVE FORM LIST -->


<div class="card">


<h2>

Available Active Forms

</h2>



<table>


<thead>

<tr>


<th>
Form Name
</th>


<th>
Description
</th>


<th>
Status
</th>


<th>
Action
</th>


</tr>


</thead>




<tbody id="formList">


<tr>

<td colspan="4"
class="loading">

Loading Forms...

</td>


</tr>


</tbody>



</table>



</div>






</div>










<script>


/*====================================
 API URL
=====================================*/


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";








/*====================================
 LOAD USER
=====================================*/


function loadUser(){


let user =

JSON.parse(

localStorage.getItem("USER")

||

"{}"

);





document.getElementById(
"schoolName"
).innerText =

user.schoolName
||
"-";





document.getElementById(
"udiseCode"
).innerText =

user.schoolCode
||
"-";





document.getElementById(
"userRole"
).innerText =

user.role
||
"SCHOOL";



}









/*====================================
 LOAD ACTIVE FORMS
=====================================*/


async function loadForms(){



try{



let response =

await fetch(

API_URL,

{


method:"POST",



headers:{


"Content-Type":

"text/plain;charset=utf-8"


},



body:

JSON.stringify({


action:"forms"


})



}

);







let result =

JSON.parse(

await response.text()

);







let html="";







if(

result.success !== true

){



html =

`

<tr>

<td colspan="4">

No Forms Available

</td>

</tr>

`;



}

else{





result.data.forEach(

function(form){





if(

String(form.status)

.toUpperCase()

===

"ACTIVE"

)

{





html +=



`

<tr>


<td>

${form.name}

</td>



<td>

${form.description || "-"}

</td>



<td>

<span class="badge">

ACTIVE

</span>

</td>



<td>


<button

class="open"

onclick="openForm('${form.id}')">


Open


</button>


</td>



</tr>


`;



}



}

);





}







if(html===""){


html=

`

<tr>

<td colspan="4">

No Active Forms Found

</td>

</tr>

`;



}






document.getElementById(

"formList"

)

.innerHTML=

html;





}

catch(error){



document.getElementById(

"formList"

)

.innerHTML=

`

<tr>

<td colspan="4">

Server Connection Failed

</td>

</tr>

`;



console.error(error);



}



}









/*====================================
 OPEN FORM
=====================================*/


function openForm(id){



window.location.href =

"fill-form.html?id="+id;



}









/*====================================
 BACK
=====================================*/


function goBack(){


window.location.href=

"dashboard.html";


}









/* START */


loadUser();


loadForms();



</script>


</body>


</html>
</head>
