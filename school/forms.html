<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - School Forms
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:"Segoe UI",Arial,sans-serif;
background:#f4f7fb;

}



.header{

background:#0d47a1;
color:white;
padding:20px 30px;

display:flex;
justify-content:space-between;
align-items:center;

}



.header h1{
margin:0;
}



button{

border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
font-weight:bold;

}


.back{

background:#d32f2f;
color:white;

}



.container{

padding:25px;

}



.card{

background:white;
padding:25px;
border-radius:15px;

box-shadow:
0 5px 20px rgba(0,0,0,.12);

margin-bottom:20px;

}



.info{

display:flex;
gap:30px;
flex-wrap:wrap;

}



.info div{

background:#f5f9ff;
padding:15px;
border-radius:10px;

}



.title{

color:#0d47a1;
font-weight:bold;

}



table{

width:100%;
border-collapse:collapse;

}



th{

background:#0d47a1;
color:white;
padding:12px;

}


td{

padding:12px;
border-bottom:1px solid #ddd;
text-align:center;

}



.open{

background:#1565c0;
color:white;

}



.loading{

text-align:center;
padding:20px;

}


</style>


</head>



<body>



<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>

<p>
SCHOOL FORMS
</p>

</div>



<button 
class="back"
onclick="goBack()">

BACK

</button>


</div>







<div class="container">


<div class="card">


<h2>
School Information
</h2>



<div class="info">


<div>

<span class="title">
School Name
</span>

<br>

<span id="schoolName">
-
</span>


</div>



<div>

<span class="title">
UDISE Code
</span>

<br>

<span id="udiseCode">
-
</span>


</div>


</div>


</div>






<div class="card">


<h2>
Available Forms
</h2>



<table>


<thead>

<tr>

<th>
Form Name
</th>


<th>
Description
</th>


<th>
Action
</th>


</tr>


</thead>


<tbody id="formList">


<tr>

<td colspan="3" class="loading">

Loading...

</td>

</tr>


</tbody>



</table>


</div>


</div>









<script>


function loadUser(){


let user =
JSON.parse(
localStorage.getItem("USER")
||
"{}"
);



document.getElementById(
"schoolName"
).innerText =
user.schoolName || "-";



document.getElementById(
"udiseCode"
).innerText =
user.schoolCode || "-";


}



function loadForms(){


let forms=[

{

name:"PM POSHAN Monthly Report",

desc:"Monthly Mid Day Meal Data Entry"

},

{

name:"School Information Update",

desc:"Update School Details"

}


];



let html="";



forms.forEach(
form=>{


html+=

`

<tr>

<td>
${form.name}
</td>


<td>
${form.desc}
</td>


<td>

<button class="open">

Open

</button>

</td>


</tr>

`;



});



document.getElementById(
"formList"
).innerHTML =
html;



}




function goBack(){

window.location.href=
"dashboard.html";

}



loadUser();

loadForms();


</script>



</body>

</html>
