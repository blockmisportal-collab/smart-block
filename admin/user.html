<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - User Management
</title>


<style>

*{

box-sizing:border-box;

font-family:
"Segoe UI",
Arial,
sans-serif;

}



body{

margin:0;

background:#f4f7fb;

}



.header{

background:#0d47a1;

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

}



.btn{

background:#d32f2f;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}



.container{

padding:25px;

}



.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:
0 5px 20px rgba(0,0,0,.1);

margin-bottom:20px;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#0d47a1;

color:white;

padding:12px;

}



td{

padding:10px;

border-bottom:1px solid #ddd;

text-align:center;

}



.badge{

padding:5px 12px;

border-radius:20px;

background:green;

color:white;

}



.create{

background:#1976d2;

}



input,select{

padding:10px;

margin:5px;

border:1px solid #ccc;

border-radius:5px;

}



</style>


</head>


<body>



<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>

<p>
USER MANAGEMENT
</p>

</div>


<button class="btn"
onclick="location.href='dashboard.html'">

BACK

</button>


</div>





<div class="container">



<div class="card">


<h2>
Create New User
</h2>


<input id="username"
placeholder="Username">


<input id="password"
placeholder="Password">


<select id="role">

<option value="ADMIN">
ADMIN
</option>

<option value="NODAL">
NODAL
</option>

<option value="SCHOOL">
SCHOOL
</option>

</select>



<input id="name"
placeholder="Full Name">


<button
class="btn create"
onclick="createUser()">

CREATE USER

</button>


</div>







<div class="card">


<h2>
User List
</h2>



<table>


<thead>

<tr>

<th>
Username
</th>


<th>
Name
</th>


<th>
Role
</th>


<th>
Status
</th>


</tr>


</thead>



<tbody id="userTable">

</tbody>



</table>



</div>




</div>





<script src="../assets/js/users.js"></script>


</body>

</html>
