<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width,initial-scale=1.0">



<title>

SMART FORM ENTERPRISE v6.1 - School Management

</title>



<style>


*{

box-sizing:border-box;

}



body{


margin:0;


font-family:

"Segoe UI",
Arial,
sans-serif;


background:#f4f7fb;


}





/* =====================
 HEADER
===================== */


.header{


background:#0d47a1;


color:white;


padding:20px 30px;


display:flex;


justify-content:space-between;


align-items:center;


}



.header h1{


margin:0;


font-size:26px;


}



.header p{


margin:5px 0 0;


}






/* =====================
 BUTTON
===================== */


.btn{


border:none;


padding:10px 18px;


border-radius:6px;


cursor:pointer;


font-weight:bold;


}



.refresh{


background:#1976d2;


color:white;


}



.back{


background:#d32f2f;


color:white;


}







/* =====================
 CONTAINER
===================== */


.container{


padding:25px;


}




.card{


background:white;


padding:25px;


border-radius:15px;


box-shadow:


0 5px 20px rgba(0,0,0,.1);


margin-bottom:20px;


}







/* =====================
 FILTER
===================== */


.filter-box{


display:grid;


grid-template-columns:


2fr 1fr 1fr 150px;


gap:15px;


align-items:center;


}



input,
select{


width:100%;


padding:12px;


border:1px solid #ccc;


border-radius:6px;


}





.count{


font-size:20px;


font-weight:bold;


color:#0d47a1;


}






/* =====================
 TABLE
===================== */


.table-container{


overflow-x:auto;


}





table{


width:100%;


border-collapse:collapse;


}



th{


background:#0d47a1;


color:white;


padding:12px;


}



td{


padding:10px;


text-align:center;


border-bottom:1px solid #ddd;


}




tr:hover{


background:#f1f6ff;


}







/* STATUS */


.active{


background:#2e7d32;


color:white;


padding:5px 12px;


border-radius:20px;


font-size:12px;


}



.inactive{


background:#d32f2f;


color:white;


padding:5px 12px;


border-radius:20px;


font-size:12px;


}






@media(max-width:900px){


.filter-box{


grid-template-columns:1fr;


}



}


</style>

<body>


<!-- =====================
 HEADER
===================== -->


<div class="header">


<div>


<h1>

SMART FORM ENTERPRISE v6.1

</h1>


<p>

SCHOOL MANAGEMENT

</p>


</div>






<div>


<button

class="btn refresh"

onclick="loadSchools()">


🔄 Refresh


</button>






<button

class="btn back"

onclick="goBack()">


BACK


</button>



</div>



</div>









<!-- =====================
 MAIN CONTAINER
===================== -->


<div class="container">







<!-- SCHOOL FILTER -->


<div class="card">



<div class="filter-box">





<div class="count">


Total Schools :


<span id="totalSchools">

0

</span>



</div>







<input

type="text"

id="searchSchool"

placeholder="Search School / UDISE Code"

onkeyup="filterSchools()">







<select

id="nyayaFilter"

onchange="filterSchools()">



<option value="">


All Nyaya Panchayat


</option>


</select>








<select

id="statusFilter"

onchange="filterSchools()">



<option value="">


All Status


</option>




<option value="ACTIVE">


🟢 Active


</option>




<option value="INACTIVE">


🔴 Inactive


</option>



</select>







</div>



</div>









<!-- SCHOOL TABLE -->


<div class="card">



<h2>

Registered Schools


</h2>





<div class="table-container">





<table>



<thead>


<tr>



<th>

UDISE Code

</th>



<th>

School Name

</th>




<th>

Nyaya Panchayat

</th>




<th>

School Type

</th>




<th>

Status

</th>




<th>

Action

</th>



</tr>


</thead>






<tbody id="schoolTableBody">


<tr>


<td colspan="6">


Loading Schools...


</td>


</tr>


</tbody>




</table>




</div>




</div>






</div>
</head>
