<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - School Management
</title>



<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}



/* HEADER */

.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

font-size:28px;

}



.header p{

margin:5px 0 0;

}




.btn{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.refresh{

background:#1976d2;

color:white;

}



.back{

background:#d32f2f;

color:white;

}





.container{

padding:25px;

}




.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:
0 5px 20px rgba(0,0,0,.1);

margin-bottom:20px;

}




.topbar{

display:flex;

gap:15px;

flex-wrap:wrap;

align-items:center;

}




input,
select{

padding:10px;

border:1px solid #ccc;

border-radius:6px;

min-width:180px;

}





.count{

font-size:20px;

font-weight:bold;

color:#0d47a1;

}





table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}




th{

background:#0d47a1;

color:white;

padding:12px;

}



td{

padding:10px;

text-align:center;

border-bottom:1px solid #ddd;

}





tr:hover{

background:#f1f5ff;

}




.status{

padding:6px 12px;

border-radius:20px;

background:green;

color:white;

font-size:13px;

}




.loading{

text-align:center;

padding:20px;

}




@media(max-width:800px){


table{

font-size:12px;

}



.topbar{

flex-direction:column;

align-items:stretch;

}


input,
select{

width:100%;

}



}



</style>


</head>



<body>



<div class="header">


<div>


<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
SCHOOL MANAGEMENT
</p>


</div>




<div>


<button
class="btn refresh"
onclick="loadSchools()">

🔄 Refresh

</button>




<button
class="btn back"
onclick="goBack()">

BACK

</button>



</div>



</div>








<div class="container">



<div class="card">


<div class="topbar">



<div class="count">


Total Schools :

<span id="totalSchools">
0
</span>


</div>




<input

id="searchBox"

type="text"

placeholder="Search School / UDISE Code">





<select id="nyayaFilter">


<option value="">

All Nyaya Panchayat

</option>


</select>



</div>



</div>








<div class="card">


<h2>
Registered Schools
</h2>




<table>


<thead>


<tr>


<th>
UDISE Code
</th>


<th>
School Name
</th>


<th>
Nyaya Panchayat
</th>


<th>
School Type
</th>


<th>
Status
</th>



</tr>


</thead>





<tbody id="schoolTableBody">


<tr>

<td colspan="5" class="loading">

Loading...

</td>

</tr>



</tbody>



</table>



</div>



</div>









<!-- JS FILE -->

<script src="../assets/js/schools.js?v=8"></script>





<script>


function goBack(){

window.location.href =
"dashboard.html";

}



</script>




</body>

</html>
