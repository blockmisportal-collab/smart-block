<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Settings
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}



/* HEADER */

.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}


.header h1{

margin:0;

}



.btn{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.back{

background:#d32f2f;

color:white;

}





.container{

padding:25px;

}





.card{

background:white;

padding:25px;

border-radius:15px;

margin-bottom:20px;

box-shadow:

0 5px 20px rgba(0,0,0,.1);

}




.settings-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}





.box{

background:#f1f6ff;

padding:20px;

border-radius:10px;

}





.label{

font-weight:bold;

color:#0d47a1;

margin-bottom:8px;

}





input,
select{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:6px;

}





.status{

padding:8px 15px;

border-radius:20px;

background:green;

color:white;

display:inline-block;

}





.save{

background:#0d47a1;

color:white;

border:none;

padding:12px 25px;

border-radius:6px;

cursor:pointer;

}




@media(max-width:800px){


.settings-grid{

grid-template-columns:1fr;

}


}



</style>


</head>


<body>





<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
SYSTEM SETTINGS
</p>


</div>




<button
class="btn back"
onclick="goBack()">

BACK

</button>



</div>







<div class="container">







<div class="card">


<h2>
Portal Configuration
</h2>



<div class="settings-grid">



<div class="box">


<div class="label">
Portal Name
</div>


<input
value="SMART FORM ENTERPRISE v6.1">


</div>





<div class="box">


<div class="label">
Portal Status
</div>


<select>


<option>
ACTIVE
</option>


<option>
MAINTENANCE
</option>


</select>


</div>





<div class="box">


<div class="label">
Admin Email
</div>


<input
value="admin@gmail.com">


</div>





<div class="box">


<div class="label">
Session Time
</div>


<input
value="30 Minutes">


</div>




</div>


</div>









<div class="card">


<h2>
System Status
</h2>



<p>

API Connection :

<span class="status">

ONLINE

</span>

</p>




<p>

Database :

<span class="status">

CONNECTED

</span>

</p>




<p>

Google Sheet :

<span class="status">

ACTIVE

</span>

</p>



</div>








<div class="card">


<h2>
Backup & Security
</h2>



<div class="settings-grid">



<div class="box">


<div class="label">
Auto Backup
</div>


<select>

<option>
Enabled
</option>

<option>
Disabled
</option>


</select>


</div>





<div class="box">


<div class="label">
Maintenance Mode
</div>


<select>

<option>
OFF
</option>


<option>
ON
</option>


</select>


</div>




</div>



<br>


<button
class="save"
onclick="saveSettings()">

💾 Save Settings

</button>



</div>







</div>







<script>


function saveSettings(){


alert(
"Settings Saved Successfully"
);


}



function goBack(){


window.location.href=
"dashboard.html";


}



</script>





</body>

</html>
