<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Profile
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}



.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

}




.btn{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.back{

background:#d32f2f;

color:white;

}





.container{

padding:25px;

}





.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:

0 5px 20px rgba(0,0,0,.1);

margin-bottom:20px;

}





.profile{

display:grid;

grid-template-columns:200px 1fr;

gap:30px;

align-items:center;

}




.photo{

height:160px;

width:160px;

border-radius:50%;

background:#0d47a1;

color:white;

display:flex;

justify-content:center;

align-items:center;

font-size:60px;

margin:auto;

}




.info{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}





.box{

background:#f1f6ff;

padding:15px;

border-radius:10px;

}



.label{

font-weight:bold;

color:#0d47a1;

}



input{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:6px;

margin-top:8px;

}





.update{

background:green;

color:white;

border:none;

padding:12px 25px;

border-radius:6px;

cursor:pointer;

}





@media(max-width:700px){


.profile{

grid-template-columns:1fr;

}


.info{

grid-template-columns:1fr;

}


}



</style>


</head>


<body>





<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
ADMIN PROFILE
</p>


</div>



<button
class="btn back"
onclick="goBack()">

BACK

</button>



</div>








<div class="container">





<div class="card">


<div class="profile">



<div class="photo">

👤

</div>




<div>


<h2 id="name">

Administrator

</h2>


<p>

Role :
<strong>
ADMIN
</strong>

</p>


<p>

Account Status :
<span style="color:green">

ACTIVE

</span>

</p>


</div>




</div>


</div>








<div class="card">


<h2>
Profile Details
</h2>



<div class="info">



<div class="box">

<div class="label">

Name

</div>


<div id="userName">

Administrator

</div>


</div>




<div class="box">

<div class="label">

Username

</div>


<div id="username">

admin

</div>


</div>





<div class="box">

<div class="label">

Email

</div>


<div>

admin@gmail.com

</div>


</div>





<div class="box">

<div class="label">

Mobile

</div>


<div>

XXXXXXXXXX

</div>


</div>




</div>


</div>









<div class="card">


<h2>
Change Password
</h2>



<label>
New Password
</label>


<input
type="password"
id="newPassword"
placeholder="Enter New Password">





<label>
Confirm Password
</label>


<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">





<br><br>


<button
class="update"
onclick="updateProfile()">

Update Profile

</button>


</div>







</div>







<script>


document.addEventListener(
"DOMContentLoaded",
function(){


let user =

localStorage.getItem("USER")
||
sessionStorage.getItem("USER");



if(user){


try{


let data =
JSON.parse(user);



document.getElementById(
"name"
).innerHTML =

data.name
||
"Administrator";



document.getElementById(
"userName"
).innerHTML =

data.name
||
"Administrator";



document.getElementById(
"username"
).innerHTML =

data.username
||
"admin";


}

catch(e){}


}



});






function updateProfile(){


let pass1 =
document.getElementById(
"newPassword"
).value;


let pass2 =
document.getElementById(
"confirmPassword"
).value;



if(pass1!==pass2){

alert(
"Password Not Match"
);

return;

}



alert(
"Profile Updated Successfully"
);


}







function goBack(){

window.location.href=
"dashboard.html";

}



</script>




</body>

</html>
