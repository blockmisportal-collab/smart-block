<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
SMART FORM ENTERPRISE v6.1 - User Management
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;

}


/* HEADER */

.header{

background:#124ca3;
color:white;
padding:25px;

display:flex;
justify-content:space-between;
align-items:center;

}


.header h1{

margin:0;
font-size:28px;

}


.header p{

margin:5px 0 0;

}



button{

border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
font-weight:bold;

}


.refresh{

background:#1685e8;
color:white;

}


.back{

background:#e53935;
color:white;

}




.container{

padding:25px;

}




.card{

background:white;
padding:25px;
border-radius:15px;

box-shadow:
0 5px 20px rgba(0,0,0,.12);

}



.topbar{

display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;

}



.count{

font-size:18px;
font-weight:bold;
color:#124ca3;

}



input,select{

padding:10px;
border:1px solid #ccc;
border-radius:6px;

}




table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}



thead{

background:#124ca3;
color:white;

}


th,td{

padding:12px;
text-align:center;
border-bottom:1px solid #ddd;

}



tr:hover{

background:#f3f7ff;

}




.status{

padding:6px 14px;
border-radius:20px;
color:white;
font-size:13px;

}



.active{

background:green;

}


.inactive{

background:red;

}



.loading{

text-align:center;
padding:20px;

}



@media(max-width:900px){


table{

font-size:12px;

}


}

</style>


</head>


<body>



<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
USER MANAGEMENT
</p>

</div>


<div>

<button 
class="refresh"
id="refreshBtn">

🔄 Refresh

</button>


<button
class="back"
onclick="goBack()">

BACK

</button>


</div>


</div>





<div class="container">


<div class="card">



<h2>
Registered Users
</h2>




<div class="topbar">


<div class="count">

Total Users :
<span id="totalUsers">
0
</span>


</div>



<input 
type="text"
id="searchBox"
placeholder="Search User...">



<select id="roleFilter">


<option value="">
All Roles
</option>


<option value="ADMIN">
ADMIN
</option>


<option value="NODAL">
NODAL
</option>


<option value="SCHOOL">
SCHOOL
</option>


</select>




<select id="statusFilter">


<option value="">
All Status
</option>


<option value="ACTIVE">
ACTIVE
</option>


<option value="INACTIVE">
INACTIVE
</option>


</select>



</div>





<table>


<thead>

<tr>


<th>
Username
</th>


<th>
Name
</th>


<th>
Role
</th>


<th>
Nyaya Panchayat
</th>


<th>
School Code
</th>


<th>
School Name
</th>


<th>
Status
</th>



</tr>


</thead>




<tbody id="userTableBody">


<tr>

<td colspan="7" class="loading">

Loading...

</td>


</tr>



</tbody>



</table>



</div>


</div>





<script>


function goBack(){

window.location.href=
"dashboard.html";

}


</script>



<script src="../assets/js/users.js"></script>



</body>

</html>
