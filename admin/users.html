<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - User Management
</title>


<link rel="stylesheet"
href="../assets/css/style.css">


<style>


body{

margin:0;
font-family:Arial, sans-serif;
background:#f4f7fb;

}



.header{

background:#124ca3;
color:white;
padding:25px;

display:flex;
justify-content:space-between;
align-items:center;

}



.header h1{

margin:0;
font-size:28px;

}



.btn{

border:none;
padding:10px 20px;
border-radius:6px;
cursor:pointer;
font-size:15px;

}



.refresh{

background:#1987e8;
color:white;

}



.back{

background:#e53935;
color:white;

}



.container{

padding:30px;

}



.card{

background:white;
border-radius:15px;
padding:25px;

box-shadow:
0 5px 20px rgba(0,0,0,.1);

}



.title{

font-size:25px;
font-weight:bold;
margin-bottom:20px;

}



table{

width:100%;
border-collapse:collapse;

}



thead{

background:#124ca3;
color:white;

}



th,td{

padding:12px;
text-align:center;
border-bottom:1px solid #ddd;

}



tbody tr:hover{

background:#f1f5ff;

}



.status{

background:green;
color:white;

padding:6px 14px;

border-radius:20px;

font-size:13px;

}



.loading{

text-align:center;
padding:20px;

font-size:18px;

}



@media(max-width:800px){


table{

font-size:12px;

}


.container{

padding:10px;

}


}


</style>


</head>


<body>

</p>

</button>



<button

BACK

</button>


</div>


</div>





<div class="container">


<div class="card">


<div class="title">

Registered Users

</div>




<table>


<thead>


<tr>

<th>
Username
</th>


<th>
Name
</th>


<th>
Role
</th>


<th>
Nyaya Panchayat
</th>


<th>
School Code
</th>


<th>
School Name
</th>


<th>
Status
</th>


</tr>


</thead>
