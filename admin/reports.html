<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Reports MIS
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}



/* HEADER */

.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}


.header h1{

margin:0;

}



.btn{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.back{

background:#d32f2f;

color:white;

}





.container{

padding:25px;

}





.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:

0 5px 20px rgba(0,0,0,.1);

margin-bottom:20px;

}






/* REPORT CARDS */


.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

}



.stat{

background:#f1f6ff;

padding:25px;

border-radius:12px;

text-align:center;

border-left:5px solid #0d47a1;

}



.stat h2{

margin:0;

font-size:32px;

color:#0d47a1;

}





/* SEARCH */


input,
select{

padding:10px;

border:1px solid #ccc;

border-radius:6px;

margin-right:10px;

}





table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#0d47a1;

color:white;

padding:12px;

}



td{

padding:10px;

text-align:center;

border-bottom:1px solid #ddd;

}





.status{

background:green;

color:white;

padding:5px 12px;

border-radius:20px;

}





.export{

background:green;

color:white;

border:none;

padding:10px 20px;

border-radius:6px;

cursor:pointer;

}





@media(max-width:900px){


.stats{

grid-template-columns:1fr;

}


}



</style>


</head>



<body>





<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
REPORTS MIS DASHBOARD
</p>


</div>




<button
class="btn back"
onclick="goBack()">

BACK

</button>


</div>








<div class="container">







<div class="card">


<h2>
Reports Overview
</h2>




<div class="stats">



<div class="stat">

<h2 id="totalForms">
0
</h2>

<p>
Total Forms
</p>

</div>




<div class="stat">

<h2 id="responses">
0
</h2>

<p>
Total Responses
</p>

</div>




<div class="stat">

<h2 id="submitted">
0
</h2>

<p>
Submitted
</p>

</div>




<div class="stat">

<h2 id="pending">
0
</h2>

<p>
Pending
</p>

</div>




</div>


</div>









<div class="card">


<h2>
Search Report
</h2>


<input
id="search"
placeholder="Search School / UDISE">


<select id="statusFilter">


<option value="">
All Status
</option>


<option>
Submitted
</option>


<option>
Pending
</option>


</select>



<button
class="export"
onclick="exportReport()">

⬇ Export

</button>


</div>









<div class="card">


<h2>
School Wise Report
</h2>




<table>


<thead>


<tr>

<th>
UDISE Code
</th>


<th>
School Name
</th>


<th>
Form
</th>


<th>
Status
</th>


</tr>


</thead>



<tbody id="reportTable">


<tr>

<td colspan="4">

No Data Available

</td>

</tr>


</tbody>


</table>



</div>









<div class="card">


<h2>
Nodal Wise Report
</h2>




<table>


<thead>


<tr>

<th>
Nodal Name
</th>


<th>
Schools
</th>


<th>
Submission
</th>


<th>
Status
</th>


</tr>


</thead>



<tbody>


<tr>

<td>
-
</td>

<td>
-
</td>

<td>
-
</td>

<td>
-
</td>


</tr>


</tbody>


</table>



</div>







</div>









<script>


function goBack(){


window.location.href=
"dashboard.html";


}




function exportReport(){


alert(
"Export Module Coming Soon"
);


}





</script>




</body>

</html>
