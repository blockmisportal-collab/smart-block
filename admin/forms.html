<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width,initial-scale=1.0">



<title>

SMART FORM ENTERPRISE v6.1 - Form Management

</title>




<style>


*{

box-sizing:border-box;

}



body{


margin:0;


font-family:

"Segoe UI",
Arial,
sans-serif;


background:#f4f7fb;


}





/* =====================
 HEADER
===================== */


.header{


background:#0d47a1;


color:white;


padding:20px 30px;


display:flex;


justify-content:space-between;


align-items:center;


}



.header h1{


margin:0;


font-size:26px;


}



.header p{


margin:5px 0 0;


}







/* =====================
 BUTTON
===================== */


.btn{


border:none;


padding:10px 18px;


border-radius:6px;


cursor:pointer;


font-weight:bold;


}



.back{


background:#d32f2f;


color:white;


}



.add{


background:#0d47a1;


color:white;


}



.refresh{


background:#1976d2;


color:white;


}








/* =====================
 CONTAINER
===================== */


.container{


padding:25px;


}





.card{


background:white;


padding:25px;


border-radius:15px;


margin-bottom:20px;


box-shadow:


0 5px 20px rgba(0,0,0,.1);


}







/* =====================
 FILTER
===================== */


.filter-box{


display:grid;


grid-template-columns:


2fr 1fr 150px;


gap:15px;


align-items:center;


}




input,
select,
textarea{


width:100%;


padding:12px;


border:1px solid #ccc;


border-radius:6px;


}





.count{


font-size:20px;


font-weight:bold;


color:#0d47a1;


}







/* =====================
 TABLE
===================== */


.table-container{


overflow-x:auto;


}





table{


width:100%;


border-collapse:collapse;


}



th{


background:#0d47a1;


color:white;


padding:12px;


}



td{


padding:10px;


text-align:center;


border-bottom:1px solid #ddd;


}




tr:hover{


background:#f1f6ff;


}








/* STATUS */


.active{


background:#2e7d32;


color:white;


padding:5px 12px;


border-radius:20px;


font-size:12px;


}




.deactive{


background:#d32f2f;


color:white;


padding:5px 12px;


border-radius:20px;


font-size:12px;


}







@media(max-width:900px){


.filter-box{


grid-template-columns:1fr;


}


}



</style>

<body>



<!-- =====================
 HEADER
===================== -->


<div class="header">


<div>


<h1>

SMART FORM ENTERPRISE v6.1

</h1>


<p>

FORM MANAGEMENT

</p>


</div>





<div>


<button

class="btn refresh"

onclick="loadForms()">


🔄 Refresh


</button>






<button

class="btn back"

onclick="goBack()">


BACK


</button>




</div>



</div>









<div class="container">








<!-- =====================
 FORM SUMMARY
===================== -->


<div class="card">



<div class="filter-box">





<div class="count">


Total Forms :


<span id="totalForms">

0

</span>



</div>








<input

type="text"

id="searchForm"

placeholder="Search Form Name..."

onkeyup="filterForms()">








<select

id="statusFilter"

onchange="filterForms()">



<option value="">


📋 All Forms


</option>



<option value="ACTIVE">


✅ Active Form


</option>



<option value="DEACTIVE">


⛔ De-Active Form


</option>



</select>




</div>



</div>









<!-- =====================
 FORM LIST
===================== -->


<div class="card">



<h2>

Form List

</h2>





<div class="table-container">





<table>



<thead>


<tr>



<th>

Form Name

</th>



<th>

Description

</th>




<th>

Total Fields

</th>




<th>

Status

</th>




<th>

Action

</th>



</tr>


</thead>







<tbody id="formTableBody">


<tr>


<td colspan="5">


Loading Forms...


</td>


</tr>


</tbody>





</table>





</div>




</div>









<!-- =====================
 CREATE FORM BUTTON
===================== -->


<div class="card">



<button

class="btn add"

onclick="showBuilder()">



➕ Create New Form



</button>




</div>









<!-- =====================
 FORM BUILDER
===================== -->


<div class="card"

id="builderSection"

style="display:none;">



<h2>

Create New Form

</h2>







<label>

Form Name

</label>


<input

id="formName"

placeholder="Enter Form Name">







<label>

Description

</label>


<textarea

id="description"

placeholder="Form Description">

</textarea>









<h3>

Form Fields

</h3>




<div id="fields">


</div>






<button

class="btn add"

onclick="addField()">



+ Add Field


</button>









<h3>

Preview

</h3>



<div

id="preview">


No Field Added


</div>







<br>


<button

class="btn add"

onclick="saveForm()">



💾 Save Form


</button>





</div>







</div>
  <script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";



let FORMS=[];

let fieldsCount=0;








/* =====================
 PAGE LOAD
===================== */


document.addEventListener(
"DOMContentLoaded",

function(){

loadForms();

});









/* =====================
 LOAD FORMS
===================== */


async function loadForms(){


try{


let response =

await fetch(API_URL,{

method:"POST",

headers:{


"Content-Type":

"text/plain;charset=utf-8"

},


body:JSON.stringify({

action:"forms"

})


});




let result =

JSON.parse(

await response.text()

);





if(result.success){


FORMS=result.data;


document.getElementById(
"totalForms"
).innerHTML=

FORMS.length;



displayForms(FORMS);


}


}

catch(error){


console.log(error);


}



}









/* =====================
 DISPLAY FORMS
===================== */


function displayForms(data){



let html="";





if(data.length===0){


html=`

<tr>

<td colspan="5">

No Form Found

</td>

</tr>

`;

}


data.forEach(function(form){



html += `


<tr>


<td>

${form.name}

</td>



<td>

${form.description || ""}

</td>




<td>

${form.fields ? form.fields.length : 0}

</td>





<td>


<span class="${
String(form.status).toUpperCase()=="ACTIVE"

?

"active"

:

"deactive"

}">


${form.status}


</span>


</td>






<td>


<button

class="btn refresh"

onclick="changeFormStatus('${form.id}')">

Status

</button>


</td>



</tr>


`;



});






document.getElementById(
"formTableBody"
).innerHTML=html;



}









/* =====================
 FILTER
===================== */


function filterForms(){



let search =

document.getElementById(
"searchForm"
).value
.toLowerCase();





let status =

document.getElementById(
"statusFilter"
).value;





let data =

FORMS.filter(function(item){



return(


String(item.name)
.toLowerCase()
.includes(search)


)

&&


(


status===""

||

String(item.status)
.toUpperCase()
===status


);



});




displayForms(data);



}









/* =====================
 SHOW BUILDER
===================== */


function showBuilder(){


document.getElementById(
"builderSection"
).style.display="block";


}








/* =====================
 ADD FIELD
===================== */


function addField(){


fieldsCount++;


let div=

document.createElement(
"div"
);



div.className="field";



div.innerHTML=


`

<input

class="fieldName"

placeholder="Field Name"

onkeyup="updatePreview()">



<select

class="fieldType"

onchange="updatePreview()">



<option>
Text
</option>


<option>
Number
</option>


<option>
Date
</option>


<option>
Dropdown
</option>


<option>
File Upload
</option>


</select>


<button

class="btn back"

onclick="this.parentElement.remove();updatePreview();">


Remove


</button>


`;



document
.getElementById("fields")
.appendChild(div);



updatePreview();



}









/* =====================
 PREVIEW
===================== */


function updatePreview(){


let html="";




document
.querySelectorAll(".field")
.forEach(function(f){



html +=


`

<div class="card">

<b>

${
f.querySelector(".fieldName").value
||
"Field Name"

}

</b>


<br>


Type :

${
f.querySelector(".fieldType").value

}


</div>

`;



});





document.getElementById(
"preview"
).innerHTML=

html || "No Field Added";



}









/* =====================
 SAVE FORM
===================== */


async function saveForm(){



let data={



action:"createForm",



form:{


name:

document.getElementById(
"formName"
).value,



description:

document.getElementById(
"description"
).value,



fields:[]



}



};





document
.querySelectorAll(".field")
.forEach(function(item){



data.form.fields.push({


name:

item.querySelector(".fieldName").value,


type:

item.querySelector(".fieldType").value


});


});





console.log(data);





alert(

"Form Saved Successfully"

);



loadForms();



}









/* =====================
 CHANGE STATUS
===================== */


function changeFormStatus(id){


alert(

"Form Status Update : "

+

id

);



}









function goBack(){


window.location.href=

"dashboard.html";


}



</script>



</body>

</html>
</head>
