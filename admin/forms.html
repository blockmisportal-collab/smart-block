<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
SMART FORM ENTERPRISE v6.1 - Form Builder
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial;

background:#f4f7fb;

}



/* HEADER */

.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}


.header h1{

margin:0;

}


.btn{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.back{

background:#ff5252;

color:white;

}




.container{

padding:25px;

}




.card{

background:white;

padding:25px;

border-radius:15px;

margin-bottom:20px;

box-shadow:

0 5px 20px rgba(0,0,0,.1);

}





input,
textarea,
select{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:6px;

margin-top:8px;

}





label{

font-weight:bold;

color:#0d47a1;

}





.field{

background:#f5f8ff;

padding:15px;

border-radius:10px;

margin-bottom:15px;

display:flex;

gap:10px;

align-items:center;

}




.field input{

margin:0;

}




.remove{

background:#d32f2f;

color:white;

border:none;

padding:8px 12px;

border-radius:5px;

cursor:pointer;

}




.add{

background:#0d47a1;

color:white;

border:none;

padding:12px 20px;

border-radius:6px;

cursor:pointer;

}




.save{

background:green;

color:white;

border:none;

padding:12px 25px;

border-radius:6px;

cursor:pointer;

}



/* PREVIEW */


.preview{

background:#fafafa;

padding:20px;

border-radius:10px;

}



.preview-box{

background:white;

padding:15px;

margin:10px 0;

border-radius:6px;

border:1px solid #ddd;

}



</style>


</head>


<body>



<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
FORM BUILDER
</p>


</div>



<button
class="btn back"
onclick="goBack()">

BACK

</button>


</div>







<div class="container">





<div class="card">


<h2>
Create New Form
</h2>



<label>
Form Name
</label>


<input
id="formName"
placeholder="Enter Form Name">





<label>
Description
</label>


<textarea
id="description"
placeholder="Form Description"></textarea>


</div>







<div class="card">


<h2>
Form Fields
</h2>



<div id="fields">


</div>




<button
class="add"
onclick="addField()">

+ Add Field

</button>


</div>







<div class="card">


<h2>
Form Preview
</h2>


<div
class="preview"
id="preview">


No Field Added


</div>


</div>







<div class="card">


<button
class="save"
onclick="saveForm()">

💾 Save Form

</button>


</div>





</div>








<script>


let count=0;





function addField(){


count++;


let div=document.createElement(
"div"
);


div.className="field";


div.innerHTML=


`

<input 
type="text"
placeholder="Field Name"
class="fieldName"
onkeyup="updatePreview()">



<select
class="fieldType"
onchange="updatePreview()">


<option>
Text
</option>


<option>
Number
</option>


<option>
Date
</option>


<option>
Dropdown
</option>


<option>
Checkbox
</option>


<option>
File Upload
</option>


</select>



<button
class="remove"
onclick="removeField(this)">

Remove

</button>


`;



document
.getElementById("fields")
.appendChild(div);



updatePreview();


}





function removeField(btn){


btn.parentElement.remove();


updatePreview();


}







function updatePreview(){


let preview=

document.getElementById(
"preview"
);



let fields=

document.querySelectorAll(
".field"
);



if(fields.length===0){


preview.innerHTML=
"No Field Added";


return;

}




let html="";



fields.forEach(function(item){



let name=

item.querySelector(
".fieldName"
).value;



let type=

item.querySelector(
".fieldType"
).value;



html+=


`

<div class="preview-box">

<b>
${name || "Field Name"}
</b>

<br>

Type :
${type}

</div>

`;



});



preview.innerHTML=html;


}







function saveForm(){


let data={


name:

document.getElementById(
"formName"
).value,


description:

document.getElementById(
"description"
).value,


fields:

[]


};



document
.querySelectorAll(".field")
.forEach(function(item){


data.fields.push({


name:

item.querySelector(".fieldName").value,


type:

item.querySelector(".fieldType").value


});


});





console.log(
"FORM DATA",
data
);



alert(
"Form Saved Successfully"
);



}






function goBack(){


window.location.href=
"dashboard.html";


}



</script>



</body>

</html>
