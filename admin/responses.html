<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Response Report
</title>



<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}




.header{


background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

}





button{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}




.back{

background:#d32f2f;

color:white;

}





.refresh{

background:#1565c0;

color:white;

}







.container{

padding:25px;

}





.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

margin-bottom:20px;

}







.stats{

display:grid;

grid-template-columns:

repeat(4,1fr);

gap:20px;

}




.stat-card{


background:#f5f9ff;

padding:20px;

border-radius:12px;

text-align:center;

border-left:5px solid #0d47a1;


}



.stat-card h2{

margin:0;

color:#0d47a1;

font-size:30px;

}





.stat-card p{

font-weight:bold;

}








.filter-box{

display:flex;

gap:15px;

flex-wrap:wrap;

}





input,
select{


padding:12px;

border:1px solid #ccc;

border-radius:6px;

min-width:220px;


}








table{

width:100%;

border-collapse:collapse;

}



th{


background:#0d47a1;

color:white;

padding:12px;

}



td{


padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}





tr:hover{


background:#f1f6ff;


}






.view{

background:#2e7d32;

color:white;

}






.loading{


text-align:center;

padding:20px;


}








@media(max-width:800px){



.stats{

grid-template-columns:

repeat(2,1fr);


}



table{

font-size:12px;

}



}



</style>


</head>
<body>


<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
RESPONSE REPORT DASHBOARD
</p>


</div>



<div>


<button
class="refresh"
onclick="loadResponses()">

🔄 Refresh

</button>



<button
class="back"
onclick="goBack()">

BACK

</button>


</div>



</div>









<div class="container">





<!-- STATISTICS -->


<div class="card">


<div class="stats">



<div class="stat-card">


<h2 id="totalResponse">

0

</h2>


<p>

Total Response

</p>


</div>






<div class="stat-card">


<h2 id="todayResponse">

0

</h2>


<p>

Today Response

</p>


</div>







<div class="stat-card">


<h2 id="totalSchool">

0

</h2>


<p>

Schools

</p>


</div>







<div class="stat-card">


<h2 id="totalForm">

0

</h2>


<p>

Forms

</p>


</div>



</div>


</div>









<!-- FILTER -->


<div class="card">


<h2>
Search Response
</h2>




<div class="filter-box">



<input

id="searchBox"

placeholder="Search School / Form / UDISE"

onkeyup="filterResponse()">





<select

id="formFilter"

onchange="filterResponse()">



<option value="">

All Forms

</option>


</select>



</div>



</div>









<!-- TABLE -->


<div class="card">


<h2>

Submitted Responses

</h2>





<table>


<thead>


<tr>


<th>
Form Name
</th>


<th>
School Name
</th>


<th>
UDISE Code
</th>


<th>
Date
</th>


<th>
Action
</th>



</tr>


</thead>






<tbody id="responseTable">


<tr>

<td colspan="5"

class="loading">

Loading...

</td>


</tr>


</tbody>



</table>



</div>






</div>









<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";





let RESPONSE_DATA=[];








/*========================
 LOAD RESPONSES
=========================*/


async function loadResponses(){



try{



let response =

await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({

action:"responses"

})


}

);





let result =

JSON.parse(

await response.text()

);






if(result.success){



RESPONSE_DATA=result.data;


displayResponses(RESPONSE_DATA);


updateStats(RESPONSE_DATA);


}




}

catch(error){


console.log(error);


}




}









/*========================
 DISPLAY TABLE
=========================*/


function displayResponses(data){



let html="";





if(data.length===0){


html=`

<tr>

<td colspan="5">

No Response Found

</td>

</tr>

`;

}


data.forEach(item=>{



html+=


`

<tr>


<td>

${item.formName}

</td>



<td>

${item.schoolName}

</td>



<td>

${item.schoolCode}

</td>



<td>

${new Date(item.date)
.toLocaleDateString()}

</td>



<td>


<button

class="view"

onclick='viewResponse(${JSON.stringify(item)})'>

View

</button>


</td>



</tr>


`;



});







document.getElementById(

"responseTable"

).innerHTML=

html;



}









/*========================
 STATISTICS
=========================*/


function updateStats(data){



document.getElementById(
"totalResponse"
).innerHTML=

data.length;






let schools =

[...new Set(

data.map(

x=>x.schoolCode

)

)]

.length;



document.getElementById(
"totalSchool"
).innerHTML=

schools;





let forms =

[...new Set(

data.map(

x=>x.formName

)

)]

.length;



document.getElementById(
"totalForm"
).innerHTML=

forms;




}









/*========================
 SEARCH
=========================*/


function filterResponse(){



let text =

document.getElementById(
"searchBox"
).value

.toLowerCase();




let data =

RESPONSE_DATA.filter(item=>{


return


String(item.schoolName)

.toLowerCase()

.includes(text)



||

String(item.formName)

.toLowerCase()

.includes(text)



||

String(item.schoolCode)

.includes(text);



});





displayResponses(data);



}









/*========================
 VIEW
=========================*/


function viewResponse(data){



alert(

JSON.stringify(

data.response,

null,

2

)

);



}









function goBack(){


window.location.href=

"dashboard.html";


}






loadResponses();



</script>


</body>

</html>
