<html lang="en">

<head>

SMART FORM ENTERPRISE v6.1
- Response Dashboard
</title>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}

background:#0d47a1;

color:white;

margin:5px 0 0;

}




button{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

.refresh{

}





.filters{

gap:15px;

}



input,
select{


padding:12px;

border:1px solid #ccc;

border-radius:6px;

}




table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#0d47a1;

color:white;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover{

background:#f1f6ff;

}





.view{

background:#2e7d32;

color:white;

}



.unlock{

background:#ff9800;

color:white;

}

padding:20px;

}





@media(max-width:900px){


.stats{

grid-template-columns:

repeat(2,1fr);

}

}


}



</style>


</head>
</head>


<body>



<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
ADMIN RESPONSE DASHBOARD
</p>


</div>



<div>


<button
class="refresh"
onclick="loadResponses()">

🔄 Refresh

</button>



<button
class="back"
onclick="goBack()">

BACK

</button>


</div>


</div>








<div class="container">





<!-- DASHBOARD COUNT -->


<div class="card">


<div class="stats">





<div class="stat">

<h2 id="totalResponse">

0

</h2>

<p>
Total Response
</p>

</div>






<div class="stat">

<h2 id="totalSchool">

0

</h2>

<p>
Submitted Schools
</p>

</div>







<div class="stat">

<h2 id="totalForm">

0

</h2>

<p>
Forms
</p>

</div>







<div class="stat">

<h2 id="todayResponse">

0

</h2>

<p>
Today
</p>

</div>




</div>


</div>









<!-- FILTER -->


<div class="card">


<h2>
Search Response
</h2>




<div class="filters">



<input

id="searchBox"

placeholder="Search School / UDISE / Form"

onkeyup="filterResponse()"

>





<select

id="formFilter"

onchange="filterResponse()">


<option value="">

All Forms

</option>


</select>






<input

type="date"

id="dateFilter"

onchange="filterResponse()"

>



</div>



</div>









<!-- RESPONSE TABLE -->


<div class="card">


<h2>
Submitted Response List
</h2>




<table>


<thead>


<tr>


<th>
Form Name
</th>


<th>
School Name
</th>


<th>
UDISE Code
</th>


<th>
Date
</th>


<th>
Action
</th>



</tr>


</thead>





<tbody id="responseTable">


<tr>


<td colspan="5"
class="loading">

Loading...

</td>


</tr>


</tbody>



</table>



</div>









<!-- DETAIL POPUP -->


<div id="modal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
align-items:center;
justify-content:center;
">





<div style="
background:white;
width:90%;
max-width:600px;
padding:25px;
border-radius:15px;
">



<h2>
Response Details
</h2>




<div id="detailData">

</div>




<br>


<button

class="back"

onclick="closeModal()">

Close

</button>



</div>



</div>






<script>
 const API_URL =
"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";



let RESPONSE_DATA=[];





/*========================
 LOAD RESPONSES
========================*/


async function loadResponses(){


try{


let res = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"responses"


})


}

);





let result =

await res.json();





if(result.success){



RESPONSE_DATA = result.data;


updateDashboard(
RESPONSE_DATA
);


loadFormFilter(
RESPONSE_DATA
);


displayResponses(
RESPONSE_DATA
);


}


}

catch(error){


console.log(error);


}



}









/*========================
 DASHBOARD COUNT
========================*/


function updateDashboard(data){



document.getElementById(
"totalResponse"
).innerHTML=

data.length;






let schools =

[...new Set(

data.map(

x=>x.schoolCode

)

)]

.length;



document.getElementById(
"totalSchool"
).innerHTML=

schools;







let forms =

[...new Set(

data.map(

x=>x.formName

)

)]

.length;



document.getElementById(
"totalForm"
).innerHTML=

forms;







let today =

new Date()
.toDateString();





let count =

data.filter(

x=>{


return new Date(
x.date
)

.toDateString()

===

today;


}

)

.length;




document.getElementById(
"todayResponse"
).innerHTML=

count;



}










/*========================
 FORM FILTER
========================*/


function loadFormFilter(data){



let select =

document.getElementById(
"formFilter"
);





let forms =

[...new Set(

data.map(

x=>x.formName

)

)];





forms.forEach(

form=>{


let option =
document.createElement(
"option"
);


option.value=form;

option.text=form;


select.appendChild(option);



});


}









/*========================
 DISPLAY TABLE
========================*/


function displayResponses(data){



let html="";





if(data.length===0){


html=`

<tr>

<td colspan="5">

No Response Found

</td>

</tr>

`;



}






data.forEach(item=>{



html+=`

<tr>


<td>

${item.formName}

</td>


<td>

${item.schoolName}

</td>



<td>

${item.schoolCode}

</td>



<td>

${new Date(item.date)
.toLocaleDateString()}

</td>



<td>


<button

class="view"

onclick='viewResponse(${JSON.stringify(item)})'>

View

</button>



</td>


</tr>

`;




});






document.getElementById(
"responseTable"
).innerHTML=

html;



}









/*========================
 SEARCH FILTER
========================*/


function filterResponse(){



let search =

document.getElementById(
"searchBox"
)

.value

.toLowerCase();





let form =

document.getElementById(
"formFilter"
)

.value;






let date =

document.getElementById(
"dateFilter"
)

.value;






let data =

RESPONSE_DATA.filter(

item=>{



let matchSearch =


String(item.schoolName)

.toLowerCase()

.includes(search)



||

String(item.schoolCode)

.includes(search)



||

String(item.formName)

.toLowerCase()

.includes(search);






let matchForm =

!form

||

item.formName===form;






let matchDate =

!date

||

new Date(item.date)

.toISOString()

.substring(0,10)

===

date;






return (

matchSearch

&&

matchForm

&&

matchDate

);



}

);





displayResponses(data);



}









/*========================
 VIEW DETAIL
========================*/


function viewResponse(item){



let html = `



<p>

<b>School:</b>

${item.schoolName}

</p>


<p>

<b>UDISE:</b>

${item.schoolCode}

</p>


<p>

<b>Form:</b>

${item.formName}

</p>


<hr>



`;





Object.keys(

item.response

)

.forEach(key=>{


html+=`

<p>

<b>${key}</b> :

${item.response[key]}

</p>

`;



});






document.getElementById(
"detailData"
).innerHTML=

html;




document.getElementById(
"modal"
).style.display=

"flex";



}









function closeModal(){


document.getElementById(
"modal"
).style.display=

"none";


}









function goBack(){


window.location.href=

"dashboard.html";


}






loadResponses();
