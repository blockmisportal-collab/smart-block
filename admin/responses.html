<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Response Dashboard
</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,sans-serif;

background:#f4f7fb;

}



/* HEADER */

.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}


.header h1{

margin:0;

font-size:26px;

}


button{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.back{

background:#d32f2f;

color:white;

}


.refresh{

background:#1565c0;

color:white;

}



/* CONTAINER */


.container{

padding:25px;

}





.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

margin-bottom:20px;

}





/* STATS */


.stats{

display:grid;

grid-template-columns:

repeat(4,1fr);

gap:20px;

}



.stat{

background:#f5f9ff;

padding:20px;

border-radius:12px;

text-align:center;

border-left:5px solid #0d47a1;

}



.stat h2{

margin:0;

font-size:30px;

color:#0d47a1;

}



.stat p{

font-weight:bold;

}







/* FILTER */


.filters{

display:flex;

gap:15px;

flex-wrap:wrap;

}



input,
select{


padding:12px;

border:1px solid #ccc;

border-radius:6px;

min-width:220px;

}





/* TABLE */


table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#0d47a1;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover{

background:#f1f6ff;

}







.view{

background:#2e7d32;

color:white;

}



.unlock{

background:#ff9800;

color:white;

}





.loading{

text-align:center;

padding:20px;

}







/* MODAL */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:

rgba(0,0,0,.5);

align-items:center;

justify-content:center;

}



.modal-box{

background:white;

width:90%;

max-width:600px;

padding:25px;

border-radius:15px;

}





@media(max-width:900px){


.stats{

grid-template-columns:

repeat(2,1fr);

}


table{

font-size:12px;

}


}



</style>


</head>



<body>



<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
ADMIN RESPONSE DASHBOARD
</p>

</div>




<div>


<button
class="refresh"
onclick="loadResponses()">

🔄 Refresh

</button>


<button
class="back"
onclick="goBack()">

BACK

</button>


</div>



</div>







<div class="container">



<div class="card">


<div class="stats">



<div class="stat">

<h2 id="totalResponse">
0
</h2>

<p>
Total Response
</p>

</div>





<div class="stat">

<h2 id="totalSchool">
0
</h2>

<p>
Submitted Schools
</p>

</div>





<div class="stat">

<h2 id="totalForm">
0
</h2>

<p>
Forms
</p>

</div>





<div class="stat">

<h2 id="todayResponse">
0
</h2>

<p>
Today
</p>

</div>



</div>


</div>







<div class="card">


<h2>
Search Response
</h2>



<div class="filters">



<input

id="searchBox"

placeholder="Search School / UDISE / Form"

onkeyup="filterResponse()">





<select

id="formFilter"

onchange="filterResponse()">


<option value="">

All Forms

</option>


</select>





<input

type="date"

id="dateFilter"

onchange="filterResponse()">



</div>



</div>







<div class="card">


<h2>
Submitted Response List
</h2>



<table>


<thead>

<tr>


<th>
Form Name
</th>


<th>
School Name
</th>


<th>
UDISE Code
</th>


<th>
Date
</th>


<th>
Action
</th>


</tr>


</thead>


<tbody id="responseTable">


<tr>

<td colspan="5"
class="loading">

Loading...

</td>


</tr>


</tbody>


</table>
<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";



let RESPONSE_DATA=[];




/*========================
 LOAD RESPONSES
========================*/


async function loadResponses(){


try{


document.getElementById(
"responseTable"
).innerHTML=

`

<tr>

<td colspan="5">

Loading...

</td>

</tr>

`;





let res = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"responses"


})


}

);







let result = await res.json();






console.log(
"Response API",
result
);







if(result.success){



RESPONSE_DATA =

result.data || [];




updateDashboard(
RESPONSE_DATA
);



loadFormFilter(
RESPONSE_DATA
);



displayResponses(
RESPONSE_DATA
);




}

else{


document.getElementById(
"responseTable"
).innerHTML=

`

<tr>

<td colspan="5">

No Response Found

</td>

</tr>

`;



}



}

catch(error){



console.log(error);



document.getElementById(
"responseTable"
).innerHTML=

`

<tr>

<td colspan="5">

API Connection Error

</td>

</tr>

`;



}



}









/*========================
 DASHBOARD COUNT
========================*/


function updateDashboard(data){



document.getElementById(
"totalResponse"
).innerHTML=

data.length;






let schools =

[...new Set(

data.map(

x=>

String(x.schoolCode)

)

)]

.length;





document.getElementById(
"totalSchool"
).innerHTML=

schools;







let forms =

[...new Set(

data.map(

x=>

x.formName

)

)]

.length;





document.getElementById(
"totalForm"
).innerHTML=

forms;







let today =

new Date()

.toDateString();






let todayCount =

data.filter(

x=>{


return new Date(
x.date
)

.toDateString()

===

today;



}

)

.length;






document.getElementById(
"todayResponse"
).innerHTML=

todayCount;



}









/*========================
 FORM FILTER
========================*/


function loadFormFilter(data){



let select =

document.getElementById(
"formFilter"
);





select.innerHTML=

`

<option value="">

All Forms

</option>

`;





let forms =

[...new Set(

data.map(

x=>

x.formName

)

)];





forms.forEach(

form=>{


let option =

document.createElement(
"option"
);



option.value=form;


option.text=form;



select.appendChild(option);



});



}









/*========================
 DISPLAY RESPONSE
========================*/


function displayResponses(data){



let html="";





if(data.length===0){


html=

`

<tr>

<td colspan="5">

No Response Found

</td>

</tr>

`;



}






data.forEach(item=>{



html +=


`

<tr>


<td>

${item.formName || "-"}

</td>



<td>

${item.schoolName || "-"}

</td>



<td>

${item.schoolCode || "-"}

</td>



<td>

${new Date(item.date)

.toLocaleDateString()}

</td>



<td>


<button

class="view"

onclick='viewResponse(${JSON.stringify(item)})'>

View

</button>



<button

class="unlock"

onclick='unlockForm(${JSON.stringify(item)})'>

🔓 Unlock

</button>



</td>



</tr>


`;




});





document.getElementById(
"responseTable"
).innerHTML=

html;



}









/*========================
 SEARCH FILTER
========================*/


function filterResponse(){



let search =

document.getElementById(
"searchBox"
)

.value

.toLowerCase();





let form =

document.getElementById(
"formFilter"
)

.value;






let date =

document.getElementById(
"dateFilter"
)

.value;







let filtered =

RESPONSE_DATA.filter(

item=>{



let textMatch =


String(item.schoolName)

.toLowerCase()

.includes(search)



||

String(item.schoolCode)

.includes(search)



||

String(item.formName)

.toLowerCase()

.includes(search);








let formMatch =

!form

||

item.formName===form;






let dateMatch =

!date

||

new Date(item.date)

.toISOString()

.substring(0,10)

===

date;







return (

textMatch

&&

formMatch

&&

dateMatch

);



}

);







displayResponses(filtered);



}
 /*========================
 VIEW RESPONSE DETAIL
========================*/


function viewResponse(item){



let html = `


<p>

<b>School Name :</b>

${item.schoolName || "-"}

</p>



<p>

<b>UDISE Code :</b>

${item.schoolCode || "-"}

</p>



<p>

<b>Form Name :</b>

${item.formName || "-"}

</p>


<hr>


`;







if(item.response){



Object.keys(item.response)

.forEach(key=>{


html +=


`

<p>

<b>${key}</b> :

${item.response[key]}

</p>


`;



});



}







document.getElementById(
"detailData"
).innerHTML=

html;





document.getElementById(
"modal"
).style.display=

"flex";



}









/*========================
 CLOSE MODAL
========================*/


function closeModal(){


document.getElementById(
"modal"
).style.display=

"none";


}









/*========================
 UNLOCK FORM
========================*/


async function unlockForm(item){



let confirmUnlock =

confirm(

"क्या आप इस Form को Unlock करना चाहते हैं?"

);



if(!confirmUnlock){


return;


}






try{



let res = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"unlockForm",


formId:

item.formId,


schoolCode:

item.schoolCode



})


}

);







let result =

await res.json();







if(result.success){



alert(

"✅ Form Successfully Unlocked"

);




loadResponses();



}

else{



alert(

result.message

);



}



}

catch(error){



console.log(error);



alert(

"Server Error"

);



}



}









/*========================
 BACK
========================*/


function goBack(){


window.location.href=

"dashboard.html";


}








/*========================
 PAGE LOAD
========================*/


loadResponses();



</script>







<!-- RESPONSE MODAL -->


<div id="modal"
class="modal">


<div class="modal-box">


<h2>
Response Details
</h2>


<div id="detailData">

</div>



<br>



<button

class="back"

onclick="closeModal()">

Close

</button>



</div>


</div>





</body>

</html>

</div>
