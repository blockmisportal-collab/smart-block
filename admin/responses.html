<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - Response Report
</title>



<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}




.header{


background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

}





button{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}




.back{

background:#d32f2f;

color:white;

}





.refresh{

background:#1565c0;

color:white;

}







.container{

padding:25px;

}





.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

margin-bottom:20px;

}







.stats{

display:grid;

grid-template-columns:

repeat(4,1fr);

gap:20px;

}




.stat-card{


background:#f5f9ff;

padding:20px;

border-radius:12px;

text-align:center;

border-left:5px solid #0d47a1;


}



.stat-card h2{

margin:0;

color:#0d47a1;

font-size:30px;

}





.stat-card p{

font-weight:bold;

}








.filter-box{

display:flex;

gap:15px;

flex-wrap:wrap;

}





input,
select{


padding:12px;

border:1px solid #ccc;

border-radius:6px;

min-width:220px;


}








table{

width:100%;

border-collapse:collapse;

}



th{


background:#0d47a1;

color:white;

padding:12px;

}



td{


padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}





tr:hover{


background:#f1f6ff;


}






.view{

background:#2e7d32;

color:white;

}






.loading{


text-align:center;

padding:20px;


}








@media(max-width:800px){



.stats{

grid-template-columns:

repeat(2,1fr);


}



table{

font-size:12px;

}



}



</style>


</head>
