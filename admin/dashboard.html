<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.0 - Admin Dashboard
</title>


<style>

*{

box-sizing:border-box;

margin:0;

padding:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

}


body{

background:#f4f7fb;

min-height:100vh;

}



.header{

background:#0d47a1;

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

font-size:24px;

}



.logout{

background:#d32f2f;

color:white;

border:none;

padding:10px 20px;

border-radius:8px;

cursor:pointer;

}



.container{

padding:25px;

}



.profile{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

margin-bottom:25px;

}



.profile h2{

color:#0d47a1;

}



.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}



.card{

background:white;

padding:25px;

border-radius:15px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}



.card h3{

color:#555;

margin-bottom:15px;

}



.card p{

font-size:35px;

font-weight:bold;

color:#0d47a1;

}



.status{

color:green !important;

font-size:24px !important;

}



.footer{

text-align:center;

padding:20px;

color:#777;

}



</style>


</head>


<body>


<header class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.0
</h1>

<p>
ADMIN DASHBOARD
</p>


</div>



<button
id="logoutBtn"
class="logout">

LOGOUT

</button>


</header>





<div class="container">


<div class="profile">


<h2>
Welcome,
<span id="userName">
Administrator
</span>
</h2>


<p>

Role:

<b id="userRole">
ADMIN
</b>

</p>


</div>





<div class="cards">



<div class="card">

<h3>
Total Schools
</h3>

<p id="totalSchools">
0
</p>

</div>





<div class="card">

<h3>
Total Responses
</h3>

<p id="totalResponses">
0
</p>

</div>





<div class="card">

<h3>
Active Users
</h3>

<p id="activeUsers">
0
</p>

</div>





<div class="card">

<h3>
System Status
</h3>

<p
id="systemStatus"
class="status">

ONLINE

</p>

</div>



</div>


</div>





<div class="footer">

SMART FORM ENTERPRISE v6.0  
<br>
Google Apps Script + Google Sheets

</div>





<script src="dashboard.js"></script>


</body>

</html>
