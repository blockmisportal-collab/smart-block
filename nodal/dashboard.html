<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1
- NODAL DASHBOARD
</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:

"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}



/*========================
 HEADER
========================*/


.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

font-size:26px;

}



.header p{

margin:5px 0 0;

}





.btn{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.refresh{

background:#1565c0;

color:white;

}



.logout{

background:#d32f2f;

color:white;

}







/*========================
 CONTAINER
========================*/


.container{

padding:25px;

}






.card{

background:white;

padding:25px;

border-radius:15px;

margin-bottom:20px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

}








/*========================
 USER INFO
========================*/


.info{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:20px;

}




.box{

background:#f1f6ff;

padding:20px;

border-radius:10px;

}



.label{

font-weight:bold;

color:#0d47a1;

}



.value{

font-size:20px;

margin-top:10px;

font-weight:bold;

}







/*========================
 STATISTICS
========================*/


.stats{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:20px;

}




.stat{

padding:20px;

border-radius:12px;

text-align:center;

background:#f5f9ff;

border-left:5px solid #0d47a1;

}



.stat h2{

margin:0;

font-size:32px;

color:#0d47a1;

}



.stat p{

font-weight:bold;

}








/*========================
 FILTER
========================*/


.filter{

display:flex;

gap:15px;

flex-wrap:wrap;

}



select,
input{

padding:12px;

border:1px solid #ccc;

border-radius:6px;

min-width:220px;

}







/*========================
 STATUS BADGE
========================*/


.badge{

padding:6px 12px;

border-radius:5px;

font-weight:bold;

color:white;

display:inline-block;

}



.pending{

background:#f57c00;

}



.approved{

background:#2e7d32;

}



.rejected{

background:#d32f2f;

}






/*========================
 TABLE
========================*/


table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#0d47a1;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover{

background:#f1f6ff;

}







/*========================
 ACTION BUTTON
========================*/


.action-btn{

padding:7px 12px;

margin:3px;

border:none;

border-radius:5px;

cursor:pointer;

font-weight:bold;

}



.view{

background:#1565c0;

color:white;

}



.approve{

background:#2e7d32;

color:white;

}



.reject{

background:#d32f2f;

color:white;

}






/*========================
 MODAL
========================*/


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.5);

align-items:center;

justify-content:center;

}



.modal-box{

background:white;

width:90%;

max-width:600px;

padding:25px;

border-radius:15px;

}





.loading{

text-align:center;

padding:20px;

}







@media(max-width:900px){


.info,
.stats{

grid-template-columns:1fr;

}


table{

font-size:12px;

}



}


</style>


</head>


<body>



<div class="header">


<div>


<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
NODAL APPROVAL DASHBOARD
</p>


</div>




<div>


<button
class="btn refresh"
onclick="loadResponses()">

🔄 Refresh

</button>


<button
class="btn logout"
onclick="logout()">

Logout

</button>


</div>


</div>


<!-- =========================
 USER INFORMATION
========================= -->


<div class="card">


<h2 style="color:#0d47a1;">


Welcome,

<span id="nodalName">

Nodal User

</span>


</h2>


</div>








<!-- =========================
 NODAL DETAILS
========================= -->


<div class="card">


<div class="info">



<div class="box">


<div class="label">

Nyaya Panchayat

</div>


<div class="value"
id="nyayaPanchayat">

-

</div>


</div>







<div class="box">


<div class="label">

Assigned Schools

</div>


<div class="value"
id="schoolCount">

0

</div>


</div>








<div class="box">


<div class="label">

Role

</div>


<div class="value">

NODAL

</div>


</div>





</div>


</div>










<!-- =========================
 STATUS SUMMARY
========================= -->


<div class="card">


<div class="stats">





<div class="stat">


<h2 id="totalPending">

0

</h2>


<p>

⏳ Pending Approval

</p>


</div>







<div class="stat">


<h2 id="totalApproved">

0

</h2>


<p>

✅ Approved

</p>


</div>







<div class="stat">


<h2 id="totalRejected">

0

</h2>


<p>

❌ Rejected

</p>


</div>





</div>


</div>









<!-- =========================
 FILTER
========================= -->


<div class="card">


<h2>

Response Filter

</h2>





<div class="filter">


<select

id="statusFilter"

onchange="filterResponses()">



<option value="">

All Status

</option>



<option value="PENDING">

Pending

</option>




<option value="APPROVED">

Approved

</option>




<option value="REJECTED">

Rejected

</option>




</select>







<input

id="searchBox"

placeholder="Search School / UDISE"

onkeyup="filterResponses()">



</div>



</div>









<!-- =========================
 RESPONSE TABLE
========================= -->


<div class="card">


<h2>

School Form Responses

</h2>





<table>


<thead>


<tr>


<th>
Form Name
</th>


<th>
School Name
</th>


<th>
UDISE Code
</th>


<th>
Date
</th>


<th>
Status
</th>


<th>
Action
</th>


</tr>


</thead>





<tbody id="responseTable">


<tr>


<td colspan="6"
class="loading">


Loading...


</td>


</tr>


</tbody>



</table>



</div>









<!-- =========================
 MODAL
========================= -->


<div id="responseModal"
class="modal">



<div class="modal-box">



<h2>

Response Details

</h2>




<div id="modalData">

</div>





<br>


<button

class="btn logout"

onclick="closeModal()">


Close


</button>



</div>


</div>









<script>


/*========================
 API CONFIG
========================*/


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";





let USER =

JSON.parse(

localStorage.getItem("USER")

||

"{}"

);





let RESPONSE_DATA=[];









/*========================
 LOAD USER
========================*/


function loadUser(){



document.getElementById(
"nodalName"
).innerHTML =


USER.name

||

USER.username

||

"Nodal User";





document.getElementById(
"nyayaPanchayat"
).innerHTML =


USER.nyayaPanchayat

||

"-";



}









/*========================
 LOAD RESPONSES
========================*/


async function loadResponses(){


try{



let response = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"nodalResponses",


nyayaPanchayat:

USER.nyayaPanchayat



})


}

);






let result =

await response.json();





if(result.success){


RESPONSE_DATA =

result.data || [];



updateDashboard(
RESPONSE_DATA
);



displayResponses(
RESPONSE_DATA
);



}

else{


alert(result.message);


}



}

catch(error){


console.log(error);


}



}
 /*========================
 UPDATE DASHBOARD COUNT
========================*/


function updateDashboard(data){


let pending = 0;

let approved = 0;

let rejected = 0;




data.forEach(item=>{


let status =

String(item.status || "PENDING")
.toUpperCase();




if(status==="APPROVED"){

approved++;

}

else if(status==="REJECTED"){

rejected++;

}

else{

pending++;

}



});





document.getElementById(
"totalPending"
).innerHTML = pending;



document.getElementById(
"totalApproved"
).innerHTML = approved;



document.getElementById(
"totalRejected"
).innerHTML = rejected;



document.getElementById(
"schoolCount"
).innerHTML =

[...new Set(

data.map(
x=>x.schoolCode
)

)]

.length;



}











/*========================
 DISPLAY RESPONSE TABLE
========================*/


function displayResponses(data){


let html="";




if(data.length===0){


html=`

<tr>

<td colspan="6">

No Response Found

</td>

</tr>

`;


}



data.forEach(item=>{



let status =

String(item.status || "PENDING")
.toUpperCase();





let badge="";





if(status==="APPROVED"){



badge=

`

<span class="badge approved">

✅ APPROVED

</span>

`;



}

else if(status==="REJECTED"){



badge=

`

<span class="badge rejected">

❌ REJECTED

</span>

`;



}

else{



badge=

`

<span class="badge pending">

⏳ PENDING

</span>

`;



}







let action="";





/*
 ONLY PENDING
 CAN APPROVE / REJECT
*/


if(status==="PENDING"){



action=

`

<button

class="action-btn view"

onclick='viewResponse(${JSON.stringify(item)})'>

View

</button>





<button

class="action-btn approve"

onclick='approveResponse(${JSON.stringify(item)})'>

✅ Approve

</button>





<button

class="action-btn reject"

onclick='rejectResponse(${JSON.stringify(item)})'>

❌ Reject

</button>


`;



}

else{



action=

`

<button

class="action-btn view"

onclick='viewResponse(${JSON.stringify(item)})'>

View

</button>



`;



}







html +=

`

<tr>


<td>

${item.formName || ""}

</td>



<td>

${item.schoolName || ""}

</td>



<td>

${item.schoolCode || ""}

</td>



<td>

${new Date(item.date)
.toLocaleDateString()}

</td>



<td>

${badge}

</td>



<td>

${action}

</td>



</tr>

`;





});







document.getElementById(
"responseTable"
).innerHTML = html;



}












/*========================
 FILTER RESPONSE
========================*/


function filterResponses(){



let search =

document.getElementById(
"searchBox"
)

.value

.toLowerCase();




let status =

document.getElementById(
"statusFilter"
)

.value;






let data =

RESPONSE_DATA.filter(item=>{



let text =

(

String(item.schoolName)

+

String(item.schoolCode)

+

String(item.formName)

)

.toLowerCase();






let searchMatch =

text.includes(search);






let statusMatch =

!status

||

String(item.status)
===

status;






return (

searchMatch

&&

statusMatch

);



});





displayResponses(data);



}









/*========================
 VIEW RESPONSE
========================*/


function viewResponse(item){



let html =



`

<p>

<b>School Name:</b>

${item.schoolName}

</p>



<p>

<b>UDISE Code:</b>

${item.schoolCode}

</p>



<p>

<b>Form:</b>

${item.formName}

</p>



<p>

<b>Status:</b>

${item.status}

</p>



<hr>

`;







let response={};



try{


response =

JSON.parse(
item.response || "{}"
);


}

catch(e){


response={};


}







Object.keys(response)
.forEach(key=>{


html +=


`

<p>

<b>${key}</b> :

${response[key]}

</p>


`;



});







if(item.remark){



html +=


`

<hr>

<p>

<b>Remark:</b>

${item.remark}

</p>

`;



}







document.getElementById(
"modalData"
).innerHTML = html;





document.getElementById(
"responseModal"
)

.style.display="flex";



}








function closeModal(){


document.getElementById(
"responseModal"
)

.style.display="none";


}
 /*========================
 APPROVE RESPONSE
========================*/


async function approveResponse(item){



if(
!confirm(
"क्या आप इस Response को Approve करना चाहते हैं?"
)
){

return;

}




await updateStatus(

item,

"APPROVED",

""

);



}









/*========================
 REJECT RESPONSE
========================*/


async function rejectResponse(item){



let remark =

prompt(

"Reject करने का कारण लिखें"

);





if(
!remark
){

return;

}





await updateStatus(

item,

"REJECTED",

remark

);



}









/*========================
 UPDATE STATUS API
========================*/


async function updateStatus(
item,
status,
remark
){



try{


let response = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({



action:

status==="APPROVED"

?

"approveResponse"

:

"rejectResponse",





formId:item.formId,



schoolCode:item.schoolCode,



schoolName:item.schoolName,



nyayaPanchayat:
item.nyayaPanchayat,



remark:remark,



actionBy:

USER.name || "NODAL"



})



}

);







let result =

await response.json();





if(result.success){



alert(

"Response "

+

status

+

" Successfully"

);





loadResponses();



}

else{


alert(

result.message

);



}



}

catch(error){


alert(

"Server Error"

);



}



}











/*========================
 LOGOUT
========================*/


function logout(){


localStorage.removeItem(
"USER"
);


window.location.href="../index.html";


}









/*========================
 INITIAL LOAD
========================*/


loadUser();

loadResponses();



</script>



</div>


</body>


</html>
<div class="container">
