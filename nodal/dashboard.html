<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
SMART FORM ENTERPRISE v6.1 - NODAL DASHBOARD
</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#f4f7fb;

}




/* HEADER */

.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}


.header h1{

margin:0;

font-size:26px;

}


.header p{

margin:5px 0 0;

}





.btn{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}



.refresh{

background:#1565c0;

color:white;

}



.logout{

background:#d32f2f;

color:white;

}




/* CONTAINER */


.container{

padding:25px;

}




.card{

background:white;

padding:25px;

border-radius:15px;

margin-bottom:20px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

}





/* USER INFO */


.info{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:20px;

}



.box{

background:#f1f6ff;

padding:20px;

border-radius:10px;

}



.label{

font-weight:bold;

color:#0d47a1;

}



.value{

font-size:20px;

margin-top:10px;

font-weight:bold;

}





/* STAT CARD */


.stats{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:20px;

}



.stat{

background:#f5f9ff;

padding:20px;

border-radius:12px;

text-align:center;

border-left:5px solid #0d47a1;

}



.stat h2{

margin:0;

font-size:32px;

color:#0d47a1;

}



.stat p{

font-weight:bold;

}





/* FILTER */


.filter{

display:flex;

gap:15px;

flex-wrap:wrap;

}



select,
input{

padding:12px;

border:1px solid #ccc;

border-radius:6px;

min-width:220px;

}





/* TABLE */


table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#0d47a1;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover{

background:#f1f6ff;

}





/* BUTTONS */


.view{

background:#1565c0;

color:white;

}



.approve{

background:#2e7d32;

color:white;

}



.reject{

background:#d32f2f;

color:white;

}



.action-btn{

padding:7px 12px;

margin:3px;

border-radius:5px;

border:none;

cursor:pointer;

font-weight:bold;

}





.loading{

text-align:center;

padding:20px;

}





/* MODAL */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.5);

align-items:center;

justify-content:center;

}



.modal-box{

background:white;

width:90%;

max-width:600px;

padding:25px;

border-radius:15px;

}





@media(max-width:900px){


.info,
.stats{

grid-template-columns:1fr;

}



table{

font-size:12px;

}


}


</style>


</head>


<body>


<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>


<p>
NODAL APPROVAL DASHBOARD
</p>


</div>



<div>


<button
class="btn refresh"
onclick="loadResponses()">

🔄 Refresh

</button>


<button
class="btn logout"
onclick="logout()">

Logout

</button>


</div>


</div>

<!-- =========================
 USER INFORMATION
========================= -->


<div class="card">


<h2 style="color:#0d47a1;">

Welcome,

<span id="nodalName">

Nodal User

</span>

</h2>


</div>







<!-- =========================
 NODAL DETAILS
========================= -->


<div class="card">


<div class="info">



<div class="box">


<div class="label">

Nyaya Panchayat

</div>


<div class="value"
id="nyayaPanchayat">

-

</div>


</div>





<div class="box">


<div class="label">

Assigned Schools

</div>


<div class="value"
id="schoolCount">

0

</div>


</div>





<div class="box">


<div class="label">

Role

</div>


<div class="value">

NODAL

</div>


</div>




</div>


</div>








<!-- =========================
 APPROVAL STATUS
========================= -->


<div class="card">


<div class="stats">





<div class="stat">


<h2 id="totalPending">

0

</h2>


<p>

⏳ Pending Approval

</p>


</div>







<div class="stat">


<h2 id="totalApproved">

0

</h2>


<p>

✅ Approved

</p>


</div>







<div class="stat">


<h2 id="totalRejected">

0

</h2>


<p>

❌ Rejected

</p>


</div>





</div>


</div>








<!-- =========================
 FILTER
========================= -->


<div class="card">


<h2>

Response Filter

</h2>



<div class="filter">


<select id="statusFilter"
onchange="filterResponses()">



<option value="">

All Status

</option>


<option value="PENDING">

Pending

</option>



<option value="APPROVED">

Approved

</option>



<option value="REJECTED">

Rejected

</option>



</select>



<input

id="searchBox"

placeholder="Search School / UDISE"

onkeyup="filterResponses()">


</div>


</div>









<!-- =========================
 RESPONSE TABLE
========================= -->


<div class="card">


<h2>

School Form Responses

</h2>




<table>


<thead>


<tr>


<th>

Form Name

</th>


<th>

School Name

</th>


<th>

UDISE Code

</th>


<th>

Date

</th>


<th>

Status

</th>


<th>

Action

</th>


</tr>


</thead>




<tbody id="responseTable">


<tr>


<td colspan="6"
class="loading">

Loading...

</td>


</tr>



</tbody>



</table>



</div>







<!-- =========================
 RESPONSE MODAL
========================= -->


<div id="responseModal"
class="modal">



<div class="modal-box">


<h2>

Response Details

</h2>



<div id="modalData">

</div>




<br>


<button

class="btn logout"

onclick="closeModal()">

Close

</button>



</div>


</div>
 <script>


/*========================
 API CONFIG
========================*/


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";





let USER =

JSON.parse(

localStorage.getItem("USER")

||

"{}"

);





let RESPONSE_DATA=[];









/*========================
 LOAD USER
========================*/


function loadUser(){



document.getElementById(
"nodalName"
).innerHTML =


USER.name

||

USER.username

||

"Nodal User";





document.getElementById(
"nyayaPanchayat"
).innerHTML =


USER.nyayaPanchayat

||

"-";



}










/*========================
 LOAD RESPONSE
========================*/


async function loadResponses(){


try{



let response = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"nodalResponses",


nyayaPanchayat:

USER.nyayaPanchayat



})


}

);







let result =

await response.json();







console.log(

result

);







if(result.success){



RESPONSE_DATA =

result.data || [];





updateDashboard(
RESPONSE_DATA
);





displayResponses(
RESPONSE_DATA
);



}

else{


alert(

result.message

);



}



}

catch(error){


console.log(error);


document.getElementById(
"responseTable"
).innerHTML=

`

<tr>

<td colspan="6">

Server Error

</td>

</tr>

`;



}



}









/*========================
 DASHBOARD COUNT
========================*/


function updateDashboard(data){



let pending =

data.filter(

x=>

x.status==="PENDING"

).length;






let approved =

data.filter(

x=>

x.status==="APPROVED"

).length;







let rejected =

data.filter(

x=>

x.status==="REJECTED"

).length;







document.getElementById(
"totalPending"
).innerHTML=

pending;





document.getElementById(
"totalApproved"
).innerHTML=

approved;





document.getElementById(
"totalRejected"
).innerHTML=

rejected;





document.getElementById(
"schoolCount"
).innerHTML=


[...new Set(

data.map(

x=>x.schoolCode

)

)].length;



}










/*========================
 DISPLAY TABLE
========================*/


function displayResponses(data){



let html="";





if(data.length===0){


html=`

<tr>

<td colspan="6">

No Response Found

</td>

</tr>

`;



}






data.forEach(item=>{



html +=

`

<tr>


<td>

${item.formName}

</td>



<td>

${item.schoolName}

</td>



<td>

${item.schoolCode}

</td>



<td>

${new Date(item.date)

.toLocaleDateString()}

</td>




<td>

${item.status}

</td>



<td>


<button

class="action-btn view"

onclick='viewResponse(${JSON.stringify(item)})'>

View

</button>




<button

class="action-btn approve"

onclick='approveForm(${JSON.stringify(item)})'>

✅ Approve

</button>




<button

class="action-btn reject"

onclick='rejectForm(${JSON.stringify(item)})'>

❌ Reject

</button>



</td>



</tr>

`;



});






document.getElementById(
"responseTable"
).innerHTML=

html;



}
  /*========================
 FILTER RESPONSE
========================*/


function filterResponses(){


let search =

document.getElementById(
"searchBox"
).value.toLowerCase();




let status =

document.getElementById(
"statusFilter"
).value;






let data =

RESPONSE_DATA.filter(item=>{



let matchSearch =


String(item.schoolName)

.toLowerCase()

.includes(search)



||

String(item.schoolCode)

.includes(search);





let matchStatus =


!status

||

item.status===status;





return matchSearch && matchStatus;



});





displayResponses(data);



}









/*========================
 VIEW RESPONSE MODAL
========================*/


function viewResponse(item){



let html =

`


<p><b>School Name:</b>
${item.schoolName}</p>


<p><b>UDISE Code:</b>
${item.schoolCode}</p>


<p><b>Form Name:</b>
${item.formName}</p>


<p><b>Date:</b>
${new Date(item.date).toLocaleString()}</p>


<hr>

`;






let responseData=item.response;



try{


if(typeof responseData==="string"){

responseData=
JSON.parse(responseData);

}



Object.keys(responseData)

.forEach(key=>{


html+=

`

<p>

<b>${key}</b> :

${responseData[key]}

</p>

`;



});



}

catch(e){


html+=

`

<p>${item.response}</p>

`;



}





document.getElementById(
"modalData"
).innerHTML=

html;



document.getElementById(
"responseModal"
).style.display=

"flex";



}







function closeModal(){


document.getElementById(
"responseModal"
).style.display=

"none";


}









/*========================
 APPROVE FORM
========================*/


async function approveForm(item){



if(!confirm(

"क्या आप Form Approve करना चाहते हैं?"

)){


return;


}





updateStatus(

item,

"APPROVED",

""

);



}









/*========================
 REJECT FORM
========================*/


async function rejectForm(item){



let remark=

prompt(

"Reject Reason लिखें"

);





if(!remark){


alert(
"Remark Required"
);


return;


}




updateStatus(

item,

"REJECTED",

remark

);



}









/*========================
 UPDATE STATUS
========================*/


async function updateStatus(

item,

status,

remark

){



let action =

status==="APPROVED"

?

"approveResponse"

:

"rejectResponse";






try{



let res = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:action,


formId:item.formId,


schoolCode:item.schoolCode,


schoolName:item.schoolName,


nyayaPanchayat:item.nyayaPanchayat,


remark:remark,


actionBy:

USER.name || USER.username



})


}

);






let result=

await res.json();






if(result.success){



alert(

"✅ "

+

status

+

" Successfully"

);



loadResponses();



}

else{


alert(
result.message
);


}



}

catch(error){


alert(
"Server Error"
);


}



}








/*========================
 LOGOUT
========================*/


function logout(){


localStorage.clear();


sessionStorage.clear();



window.location.href=

"../index.html";


}









/*========================
 PAGE LOAD
========================*/


document.addEventListener(

"DOMContentLoaded",

function(){


loadUser();


loadResponses();


});


</script>

</body>

</html>
<div class="container">
