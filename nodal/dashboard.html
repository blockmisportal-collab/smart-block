<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>

SMART FORM ENTERPRISE v6.1
- NODAL DASHBOARD

</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:

"Segoe UI",
Arial,sans-serif;

background:#f4f7fb;

}




.header{

background:#0d47a1;

color:white;

padding:20px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

font-size:25px;

}



.header p{

margin:5px 0 0;

}





button{

border:none;

padding:10px 18px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}





.logout{

background:#d32f2f;

color:white;

}





.container{

padding:25px;

}





.card{

background:white;

padding:25px;

border-radius:15px;

margin-bottom:20px;

box-shadow:

0 5px 20px rgba(0,0,0,.12);

}







.info{

display:flex;

gap:20px;

flex-wrap:wrap;

}



.info-box{

background:#f5f9ff;

padding:15px;

border-radius:10px;

flex:1;

}



.title{

font-weight:bold;

color:#0d47a1;

}







.stats{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:20px;

}





.stat{

background:#f5f9ff;

padding:20px;

border-radius:12px;

text-align:center;

border-left:5px solid #0d47a1;

}



.stat h2{

margin:0;

font-size:30px;

color:#0d47a1;

}





.stat p{

font-weight:bold;

}





table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}





th{

background:#0d47a1;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover{

background:#f1f6ff;

}






.view{

background:#1565c0;

color:white;

}



.approve{

background:#2e7d32;

color:white;

}



.reject{

background:#d32f2f;

color:white;

}





.loading{

text-align:center;

padding:20px;

}





@media(max-width:900px){


.stats{

grid-template-columns:

1fr;

}



table{

font-size:12px;

}


}



</style>


</head>


<body>





<div class="header">


<div>

<h1>

SMART FORM ENTERPRISE v6.1

</h1>


<p>

NODAL APPROVAL DASHBOARD

</p>


</div>



<button

class="logout"

onclick="logout()">

LOGOUT

</button>


</div>








<div class="container">






<!-- USER INFO -->


<div class="card">


<h2>

Nodal Information

</h2>



<div class="info">



<div class="info-box">


<span class="title">

Name

</span>


<br>


<span id="nodalName">

-

</span>


</div>





<div class="info-box">


<span class="title">

Nyaya Panchayat

</span>


<br>


<span id="nyayaPanchayat">

-

</span>


</div>




</div>


</div>









<!-- COUNT -->


<div class="card">


<div class="stats">



<div class="stat">


<h2 id="totalPending">

0

</h2>


<p>

Pending Approval

</p>


</div>





<div class="stat">


<h2 id="totalApproved">

0

</h2>


<p>

Approved

</p>


</div>





<div class="stat">


<h2 id="totalRejected">

0

</h2>


<p>

Rejected

</p>


</div>



</div>


</div>








<!-- RESPONSE LIST -->


<div class="card">


<h2>

School Form Responses

</h2>



<table>


<thead>


<tr>


<th>

Form

</th>


<th>

School Name

</th>


<th>

UDISE

</th>


<th>

Date

</th>


<th>

Action

</th>


</tr>


</thead>




<tbody id="responseTable">


<tr>

<td colspan="5"
class="loading">

Loading...

</td>


</tr>



</tbody>



</table>



</div>




<script>


/*========================
 API CONFIGURATION
========================*/


const API_URL =

"https://script.google.com/macros/s/AKfycbwKTmGemqiI-Lyd-YQCIVaxkCLZfYUyENpSuKL_B7z7ZMLAmv_xtL7LbciUVI2YI9JIfw/exec";





let USER =

JSON.parse(

localStorage.getItem("USER")

||

"{}"

);





let RESPONSE_DATA=[];






/*========================
 LOAD USER
========================*/


function loadUser(){



document.getElementById(
"nodalName"
).innerHTML =


USER.name

||

USER.username

||

"-";





document.getElementById(
"nyayaPanchayat"
).innerHTML =


USER.nyayaPanchayat

||

"-";



}









/*========================
 LOAD NODAL RESPONSE
========================*/


async function loadResponses(){



try{



let res = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"nodalResponses",


nyayaPanchayat:

USER.nyayaPanchayat



})


}

);







let result =

await res.json();





console.log(
"Nodal Response",
result
);







if(result.success){



RESPONSE_DATA =

result.data || [];





updateCount(
RESPONSE_DATA
);



displayResponses(
RESPONSE_DATA
);




}

else{



document.getElementById(
"responseTable"
).innerHTML=


`

<tr>

<td colspan="5">

No Response Found

</td>

</tr>

`;



}



}

catch(error){



console.log(error);



document.getElementById(
"responseTable"
).innerHTML=


`

<tr>

<td colspan="5">

Server Error

</td>

</tr>

`;



}



}









/*========================
 UPDATE COUNT
========================*/


function updateCount(data){



let pending =

data.filter(

x=>

x.status==="PENDING"

).length;





let approved =

data.filter(

x=>

x.status==="APPROVED"

).length;





let rejected =

data.filter(

x=>

x.status==="REJECTED"

).length;







document.getElementById(
"totalPending"
).innerHTML=

pending;





document.getElementById(
"totalApproved"
).innerHTML=

approved;





document.getElementById(
"totalRejected"
).innerHTML=

rejected;



}








/*========================
 DISPLAY RESPONSE
========================*/


function displayResponses(data){



let html="";






if(data.length===0){



html=

`

<tr>

<td colspan="5">

No Pending Form

</td>

</tr>

`;



}





data.forEach(item=>{



html+=


`

<tr>


<td>

${item.formName}

</td>



<td>

${item.schoolName}

</td>




<td>

${item.schoolCode}

</td>




<td>

${new Date(item.date)
.toLocaleDateString()}

</td>




<td>


<button

class="view"

onclick='viewResponse(${JSON.stringify(item)})'>

View

</button>



<button

class="approve"

onclick='approveForm(${JSON.stringify(item)})'>

✅ Approve

</button>



<button

class="reject"

onclick='rejectForm(${JSON.stringify(item)})'>

❌ Reject

</button>



</td>


</tr>


`;



});






document.getElementById(
"responseTable"
).innerHTML=

html;



}
  /*========================
 VIEW RESPONSE
========================*/


function viewResponse(item){


let html =

`


<p>

<b>School Name:</b>

${item.schoolName}

</p>



<p>

<b>UDISE Code:</b>

${item.schoolCode}

</p>



<p>

<b>Form Name:</b>

${item.formName}

</p>


<p>

<b>Nyaya Panchayat:</b>

${item.nyayaPanchayat}

</p>


<hr>


`;






let responseData = item.response;



try{


if(typeof responseData==="string"){


responseData =

JSON.parse(responseData);


}



Object.keys(responseData)

.forEach(key=>{


html +=


`

<p>

<b>${key}</b> :

${responseData[key]}

</p>


`;



});


}

catch(e){


html +=


`

<p>

${item.response}

</p>

`;


}





alert(

html.replace(/<[^>]*>/g,'')

);



}









/*========================
 APPROVE FORM
========================*/


async function approveForm(item){



let confirmApprove =

confirm(

"क्या आप इस Form को Approve करना चाहते हैं?"

);





if(!confirmApprove){


return;


}







await updateStatus(

item,

"APPROVED",

""

);



}









/*========================
 REJECT FORM
========================*/


async function rejectForm(item){



let remark =

prompt(

"Reject करने का कारण लिखें"

);





if(!remark){


alert(

"Remark जरूरी है"

);


return;


}





await updateStatus(

item,

"REJECTED",

remark

);



}









/*========================
 UPDATE STATUS API
========================*/


async function updateStatus(

item,

status,

remark

){



try{


let res = await fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:

status==="APPROVED"

?

"approveResponse"

:

"rejectResponse",



formId:

item.formId,



schoolCode:

item.schoolCode,



schoolName:

item.schoolName,



nyayaPanchayat:

item.nyayaPanchayat,



remark:

remark,



actionBy:

USER.name || USER.username



})


}

);








let result =

await res.json();







if(result.success){



alert(

"✅ "

+

status

+

" Successfully"

);



loadResponses();



}

else{



alert(

result.message

);



}



}

catch(error){



console.log(error);



alert(

"Server Error"

);



}



}
  /*========================
 LOGOUT
========================*/


function logout(){


localStorage.clear();


sessionStorage.clear();



window.location.href =

"../index.html";


}









/*========================
 PAGE LOAD
========================*/


document.addEventListener(

"DOMContentLoaded",

function(){



loadUser();


loadResponses();



});


</script>





</body>

</html>
</div>
