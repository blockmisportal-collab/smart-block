<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
SMART FORM ENTERPRISE v6.1 - NODAL Dashboard
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:"Segoe UI",Arial,sans-serif;
background:#f4f7fb;

}



.header{

background:#0d47a1;
color:white;

padding:20px 30px;

display:flex;
justify-content:space-between;
align-items:center;

}


.header h1{
margin:0;
}



.btn{

border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
font-weight:bold;

}



.logout{

background:#d32f2f;
color:white;

}



.container{

padding:25px;

}



.card{

background:white;
padding:25px;

border-radius:15px;

box-shadow:
0 5px 20px rgba(0,0,0,.1);

margin-bottom:20px;

}



.info{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;

}



.box{

background:#f1f6ff;
padding:20px;
border-radius:10px;

}



.label{

color:#0d47a1;
font-weight:bold;

}



.value{

font-size:20px;
margin-top:10px;

}



input{

padding:10px;

border:1px solid #ccc;

border-radius:6px;

width:300px;

}




table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#0d47a1;
color:white;

padding:12px;

}



td{

padding:10px;

text-align:center;

border-bottom:1px solid #ddd;

}



.status{

background:green;
color:white;

padding:5px 12px;

border-radius:20px;

}



.services button{

margin-right:10px;

background:#0d47a1;

color:white;

border:none;

padding:8px 15px;

}



@media(max-width:800px){

.info{

grid-template-columns:1fr;

}

}

</style>

</head>



<body>



<div class="header">


<div>

<h1>
SMART FORM ENTERPRISE v6.1
</h1>

<p>
NODAL DASHBOARD
</p>


</div>


<button 
class="btn logout"
onclick="logout()">

Logout

</button>


</div>





<div class="container">



<div class="card">


<h2>
Welcome <span id="userName">NODAL USER</span>
</h2>



<div class="info">


<div class="box">

<div class="label">
Nyaya Panchayat
</div>

<div class="value" id="nyaya">
-
</div>

</div>



<div class="box">

<div class="label">
Assigned Schools
</div>

<div class="value" id="schoolCount">
0
</div>

</div>



<div class="box">

<div class="label">
Role
</div>

<div class="value">
NODAL
</div>

</div>



</div>


</div>





<div class="card">


<h2>
Assigned School List
</h2>


<input 
id="schoolSearch"
placeholder="Search School / UDISE Code">





<table>


<thead>

<tr>

<th>
UDISE Code
</th>


<th>
School Name
</th>


<th>
School Type
</th>


<th>
Status
</th>


</tr>


</thead>



<tbody id="schoolList">


<tr>

<td colspan="4">

Loading...

</td>

</tr>


</tbody>


</table>



</div>







<div class="card">


<h2>
Available Services
</h2>


<div class="services">


<button>
📝 Forms
</button>


<button>
📊 Reports
</button>


<button>
👤 Profile
</button>


</div>


</div>





</div>







<script src="assets/js/dashboard.js"></script>



<script>


function logout(){

sessionStorage.clear();

localStorage.clear();

location.href="../index.html";

}


</script>



</body>

</html>
